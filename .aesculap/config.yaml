enabled: true
mode: observe
aesculap_home: E:\rhProject\.aesculap
state_dir: E:\rhProject\.aesculap\state
audit_log_path: E:\rhProject\.aesculap\state\audit.jsonl
scope:
  tier: A
  project_root: E:\rhProject
  hermes_config_dir: C:\Users\RUHAI\.hermes
  identity_files:
  - C:\Users\RUHAI\.hermes\persona.md
  - C:\Users\RUHAI\.hermes\memories\**\*
  extra_blacklist:
  - C:\Users\RUHAI\.hermes\skills\**\*
detectors:
  log_paths:
  - C:\Users\RUHAI\.hermes\logs\agent.log
  error_patterns:
  - Traceback
  - CRITICAL
  - \bERROR\b
  liveness_interval_seconds: 120
  full_checkup_interval_seconds: 86400
debounce:
  recheck_seconds: 60
  consecutive_threshold: 2
probes:
- name: hermes-process-alive
  type: process_alive
  params:
    pattern: hermes
- name: log-error-burst
  type: log_error_count
  params:
    path: C:\Users\RUHAI\.hermes\logs\agent.log
    lines: 200
    patterns:
    - Traceback
    - CRITICAL
    fail_threshold: 1
- name: disk-space
  type: disk_free
  params:
    path: E:\
    warn_percent: 90
    fail_percent: 97
triage:
  provider: anthropic
  model: MiniMax-M3
  base_url: https://api.minimaxi.com/anthropic
  api_key_env: MINIMAX_API_KEY
selffix:
  provider: anthropic
  model: MiniMax-M3
  base_url: https://api.minimaxi.com/anthropic
  api_key_env: MINIMAX_API_KEY
  retry_budget: 3
  observe_window_seconds: 60
coding_agent:
  tool: claude
  command_template: claude -p {prompt} --output-format json
notify:
  command_template: hermes gateway send --text {message}
  cooldown_seconds: 3600
