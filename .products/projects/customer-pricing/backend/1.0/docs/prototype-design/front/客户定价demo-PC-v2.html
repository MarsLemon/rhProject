                },
                'Aux. diesel generator aggregates, complete': {
                    "base_info": { "equipment_name": "Aux. diesel generator aggregates, complete" },
                    "all_maintenance_types": ["液压和电控系统保养", "健康检查", "监工服务", "车间保养测试", "常规吊缸类", "故障排查维修", "部件翻新"],
                    "equipment_series": []
                }
            };

            let EQUIPMENT_NAME = 'Main diesel engine';
            // 设备 → 设备编码（dev）：主机柴油机=601.001，辅助柴油发电机组=651.001（与后台 CATALOG 一致）
            const EQUIP_DEV = { 'Main diesel engine': '601.001', 'Aux. diesel generator aggregates, complete': '651.001' };
            let MAINTENANCE_TYPES = [];
            let MODEL_TO_SERIES = {};
            let SERIES_INFO = {};
            let ALL_MANUFACTURERS = [];
            let SPECIAL_5Y_LEAVES = [];
            let ITEM_MAP = {};
            let DEMO_PACKAGES = [];   // demo 套餐，以后再台 PACKAGES（PKG-STD）为准重建
            let SI_TO_KEY = {};       // 服务项编码 → demo 项 key（rebuildItemsFromBackend 填充）
            let PKG_KEY_SET = new Set(); // 后台套餐 PKG-STD 精确命中的 demo 项 key 集合（严格以后台数据为准）
            let SUG_SET = new Set();  // 后台 RULES.sug 建议加选项 key 集合（严格以后台数据为准）
            let SUG_MAP = {};         // demo 项 key → { mode, qty }（后台建议的默认数量）

            // resolveLaborStandard 在 data.js 全局作用域调用 groupCodeOfModel（后台 core.js 提供）；
            // demo 未加载 core.js，故在此补齐一个 window 级实现，供 data.js 全局函数可见。
            window.groupCodeOfModel = function (name) {
                const g = (typeof groupOfModel === 'function') ? groupOfModel(name) : null;
                return g ? g.code : null;
            };

            // 维保类型 → 编码（用于计价上下文）
            function currentMaintType() {
                return (typeof MTYPES !== 'undefined')
                    ? MTYPES.find(function (x) { return x.name === maintType.value; }) || null : null;
            }
            function maintTypeCode() {
                const t = currentMaintType();
                return t ? t.code : null;
            }
            // R-28：周期只在类型启用周期时生效；未启用的类型不得带周期（IN-MC-09）
            function maintCycleEnabled() {
                const t = currentMaintType();
                return !!(t && t.cycle);
            }
            function currentCycle() {
                return maintCycleEnabled() ? ((maintCycleHours && maintCycleHours.value) || '') : '';
            }
            // R-07：维保类型按设备挂载；未配置挂载时退回全量
            function mountedTypeCodes(dev) {
                if (typeof CATALOG === 'undefined') return null;
                let node = null;
                (function walk(ns) {
                    ns.forEach(function (n) {
                        if (n.code === dev) node = node || n;
                        if (n.children && n.children.length) walk(n.children);
                    });
                })(CATALOG);
                if (!node || !Array.isArray(node.mts) || !node.mts.length) return null;
                return node.mts.slice();
            }

            // 从后台领域模型重建维修项台账：SITEMS（mt=HYDELEC），数量 base_qty 按后台套餐 PKG-STD 反推
            function rebuildItemsFromBackend() {
                // 多套餐兼容：聚合全部后台套餐 PACKAGES 的 SI 编码 → 默认数量设定，
                // 避免命中非首个套餐时其项遗漏（SI_TO_KEY 已覆盖全部 SITEMS，此处仅决定基础数量）
                const pkgs = (typeof PACKAGES !== 'undefined') ? PACKAGES : [];
                const pkgMap = {};
                pkgs.forEach(function (bp) {
                    (bp.items || []).forEach(function (it) {
                        if (it && it.ref && typeof it.ref === 'string' && it.ref.indexOf('labor:') < 0) {
                            if (pkgMap[it.ref] === undefined) pkgMap[it.ref] = { mode: it.mode, qty: it.qty };
                        }
                    });
                });
                SPECIAL_5Y_LEAVES = [];
                ITEM_MAP = {};
                SI_TO_KEY = {};
                // 后台 RULES.sug：按当前设备(dev)+维保类型(mt)+周期(cycle) 给出的"建议加选"服务项
                const sugDev = (typeof EQUIP_DEV !== 'undefined' && EQUIP_DEV[EQUIPMENT_NAME]) ? EQUIP_DEV[EQUIPMENT_NAME] : '601.001';
                const sugMt = maintTypeCode();
                const sugCycle = currentCycle();
                const sugBySi = {};
                if (typeof RULES !== 'undefined' && RULES.sug) {
                    RULES.sug.forEach(function (r) {
                        if (!r || !r.si) return;
                        if (r.dev && r.dev !== sugDev) return;
                        if (sugMt && r.mt && r.mt !== sugMt) return;
                        if (r.cycle && r.cycle !== sugCycle) return;
                        sugBySi[r.si] = { mode: r.mode, qty: r.qty, badge: !!r.badge };
                    });
                }
                SUG_SET = new Set();
                SUG_MAP = {};
                SITEMS.forEach(function (s) {
                    if (s.mt && s.mt !== 'HYDELEC') return;   // demo 仅展示液压和电控类（与 v8 一致）
                    const key = siGroupOf(s) + '::' + s.name;
                    if (ITEM_MAP[key]) return;
                    const pm = pkgMap[s.code];
                    let base_qty = pm ? (pm.mode === 'auto_cylinder' ? '缸数' : (parseInt(pm.qty, 10) || 1)) : 1;
                    // 后台建议加选：以 RULES.sug 给出的数量作为该项默认数量（优先于通用默认）
                    const su = sugBySi[s.code];
                    const suggested = !!su;
                    if (su) base_qty = (su.mode === 'auto_cylinder' ? '缸数' : (parseInt(su.qty, 10) || 1));
                    ITEM_MAP[key] = {
                        key: key, cat: siGroupOf(s), siCode: s.code, item_name: s.name,
                        unit: s.unit || '', base_qty: base_qty, unit_price_usd: 0, suggested: suggested
                    };
                    SPECIAL_5Y_LEAVES.push(ITEM_MAP[key]);
                    SI_TO_KEY[s.code] = key;
                    if (su) { SUG_SET.add(key); SUG_MAP[key] = { mode: su.mode, qty: su.qty }; }
                });
            }

            // 重算后台建议项集合（RULES.sug）：随维保类型(mt)/周期(cycle) 变化而刷新，
            // 避免切换类型后沿用上一次 HYDELEC 的残留可选项（demo 仅展示 HYDELEC 类项）
            function rebuildSugSet() {
                const sugBySi = {};
                if (typeof RULES !== 'undefined' && RULES.sug) {
                    const sugDev = (typeof EQUIP_DEV !== 'undefined' && EQUIP_DEV[EQUIPMENT_NAME]) ? EQUIP_DEV[EQUIPMENT_NAME] : '601.001';
                    const sugMt = maintTypeCode();
                    const sugCycle = currentCycle();
                    RULES.sug.forEach(function (r) {
                        if (!r || !r.si) return;
                        if (r.dev && r.dev !== sugDev) return;
                        if (sugMt && r.mt && r.mt !== sugMt) return;
                        if (r.cycle && r.cycle !== sugCycle) return;
                        sugBySi[r.si] = { mode: r.mode, qty: r.qty, badge: !!r.badge };
                    });
                }
                SUG_SET = new Set();
                SUG_MAP = {};
                SITEMS.forEach(function (s) {
                    if (s.mt && s.mt !== 'HYDELEC') return;
                    const key = siGroupOf(s) + '::' + s.name;
                    if (!ITEM_MAP[key]) return; // 仅对当前已建项计算建议
                    const su = sugBySi[s.code];
                    if (su) { SUG_SET.add(key); SUG_MAP[key] = { mode: su.mode, qty: su.qty }; }
                });
            }

            // 按展示规则（RULES.pkg）回溯套餐：命中顺序 型号级 > 设备级，返回命中套餐编码或 null（未命中 → R-26）
            // demo 未加载 core.js（resolveRules 不可用），此处内联等价实现，与后台 rule.html 的命中逻辑保持一致
            function resolvePkgRule() {
                if (typeof RULES === 'undefined' || !RULES.pkg) return null;
                const modelName = (model && model.value) || '';
                const mtCode = maintTypeCode();
                const cycle = currentCycle();
                const m = MODELS.find(function (x) { return x.name === modelName; }) || null;
                const dev = m ? m.dev : null;
                const f = function (r) { return r.mt === mtCode && (r.cycle || null) === (cycle || null); };
                const r = RULES.pkg.find(function (x) { return f(x) && x.level === '型号级' && x.ref === modelName; });
                if (r) return r.pkg;
                const rows = RULES.pkg.filter(function (x) { return f(x) && x.level === '设备级' && x.dev === dev; });
                return rows.length ? rows[0].pkg : null;
            }

            // 从后台套餐 PACKAGES 重建 demo 套餐：每个后台套餐一个 demo 套餐，id 用套餐编码（与 RULES.pkg 命中结果一致，便于按展示规则选中）
            function rebuildDemoPackages() {
                const pkgs = (typeof PACKAGES !== 'undefined') ? PACKAGES : [];
                DEMO_PACKAGES = pkgs.map(function (bp) {
                    const pkgSiCodes = [];
                    (bp.items || []).forEach(function (it) {
                        if (it && it.ref && typeof it.ref === 'string' && it.ref.indexOf('labor:') < 0) pkgSiCodes.push(it.ref);
                    });
                    // 严格以后台数据为准：仅选中后台套餐里明确列出的 SI 编码对应的项
                    const pkgKeys = pkgSiCodes.map(function (c) { return SI_TO_KEY[c]; }).filter(function (k) { return !!k; });
                    // 展示分组（仅用于"套餐内项目"按子系统折叠展示）：取后台套餐覆盖到的分组
                    const stdCats = {};
                    pkgSiCodes.forEach(function (c) {
                        const s = SITEMS.find(function (x) { return x.code === c; });
                        if (s) stdCats[siGroupOf(s)] = true;
                    });
                    const stdSubIds = SUBSYSTEMS.filter(function (sub) { return sub.tier === 'std' && stdCats[sub.cat]; }).map(function (sub) { return sub.id; });
                    return {
                        id: bp.code,                  // 套餐编码（与 RULES.pkg 命中结果一致）
                        code: bp.code,
                        name: bp.name || '标准保养',
                        desc: bp.desc || '',
                        recommend: !!bp.rec,
                        siCodes: pkgSiCodes,          // 后台套餐的 SI 编码（权威来源）
                        keys: pkgKeys,               // 精确命中的 demo 项 key
                        subsystems: stdSubIds.length ? stdSubIds : STANDARD_SUBSYSTEM_IDS.slice()
                    };
                });
                // PKG_KEY_SET 初始指向第一个套餐（仅用于徽标），选中具体套餐后由 selectPackage 刷新
                PKG_KEY_SET = DEMO_PACKAGES[0] ? new Set(DEMO_PACKAGES[0].keys) : new Set();
            }

            // 项目分组非必填（D2）：未分组服务项归入兜底分组「其他」
            // 分组仅用于自由选择区归组展示，不参与计价——未分组不影响定价与引用
            const SI_OTHER_GROUP = '其他';
            function siGroupOf(s) { return (s && s.grp) ? s.grp : SI_OTHER_GROUP; }

            function loadEquipmentData(name) {
                EQUIPMENT_NAME = (name && EQUIPMENT_DATA[name]) ? name : 'Main diesel engine';
                const dev = EQUIP_DEV[EQUIPMENT_NAME] || '601.001';
                if (typeof setCurrentDev === 'function') setCurrentDev(dev);  // 注入当前设备，供无型号时设备级工时标准回溯
                // 维保类型：以后台 MTYPES 为准，并按设备挂载过滤（R-07）
                const mounted = mountedTypeCodes(dev);
                MAINTENANCE_TYPES = MTYPES.filter(function (t) { return !mounted || mounted.indexOf(t.code) !== -1; })
                    .map(function (t) { return t.name; });
                // 型号 → 系列：以后台 MODELS 为准（按设备编码 dev 过滤、按默认厂家 dv 聚合展示）
                MODEL_TO_SERIES = {};
                SERIES_INFO = {};
                MODELS.filter(function (m) { return m.dev === dev; }).forEach(function (m) {
                    const brand = m.dv || (m.vendors && m.vendors[0]) || '其他';
                    if (!SERIES_INFO[brand]) SERIES_INFO[brand] = { series_name: brand, manufacturers: [], model_list: [] };
                    if (SERIES_INFO[brand].manufacturers.indexOf(brand) === -1) SERIES_INFO[brand].manufacturers.push(brand);
                    if (SERIES_INFO[brand].model_list.indexOf(m.name) === -1) SERIES_INFO[brand].model_list.push(m.name);
                    if (!MODEL_TO_SERIES[m.name]) MODEL_TO_SERIES[m.name] = brand;
                });
                ALL_MANUFACTURERS = [];
                Object.keys(SERIES_INFO).forEach(function (sn) {
                    (SERIES_INFO[sn].manufacturers || []).forEach(function (m) {
                        if (ALL_MANUFACTURERS.indexOf(m) === -1) ALL_MANUFACTURERS.push(m);
                    });
                });
                rebuildItemsFromBackend();
                // 维保类型下拉（以后台 MTYPES 列表为准）
                maintType.innerHTML = '<option value="">请选择维保类型</option>' + MAINTENANCE_TYPES.map(function (t) {
                    return '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>';
                }).join('');
                // R-07：前端默认选中第一个；未选类型时 mt=null 会使设备级标准工时无法命中 → 价格 0
                if (!maintType.value || MAINTENANCE_TYPES.indexOf(maintType.value) === -1) {
                    maintType.value = MAINTENANCE_TYPES[0] || '';
                }
                if (maintType._syncInput) maintType._syncInput();
                // 周期为空时默认选中第一个，否则周期与后台周期维度失配 → 价格取不到（IN-MC-09）
                if (!maintCycleHours.value) maintCycleHours.value = ((typeof CYCLES !== 'undefined' && CYCLES[0]) || '5年保养');
                if (maintCycleHours._syncInput) maintCycleHours._syncInput();
                cycleFieldGroup.style.display = maintCycleEnabled() ? '' : 'none';
            }
            loadEquipmentData('Main diesel engine');

            function getManufacturersForModel(modelVal) {
                const series = modelVal ? MODEL_TO_SERIES[modelVal] : '';
                return series ? (SERIES_INFO[series].manufacturers || []) : [];
            }

            // ===== 套餐 / 子系统（方案 A：直接以后台 SGROUPS 为唯一数据源生成，显示原值，与后台服务项 grp 完全一致）=====
            // tier / desc 仅用于展示与「套餐内/可选项」归类，不参与分组名；通过 SUB_META 按 grp 码补齐，
            // 未配置的分组默认 tier=opt、无描述。不再手写中文分组名，杜绝与后台对不上 / 孤儿分组的问题。
            const SUB_META = {
                'HCU': { id: 'hcu', tier: 'std', desc: '蓄能器、燃油增压器、排气阀执行器、缸套注油器、FIVA阀等' },
                'HPS': { id: 'hps', tier: 'opt', desc: '液压泵、比例方向控制阀、高压管路、蓄能器、阀块等' },
                'Electric control system': { id: 'elec', tier: 'std', desc: 'MPC控制器、线缆检查、UPS电源、绝缘检测、功能测试等' },
                'Tacho system': { id: 'tacho', tier: 'std', desc: '角度编码器校准、触发环+传感器校准' },
                'Pneumatic control system Overhaul': { id: 'pneu', tier: 'std', desc: '气动控制系统整体翻新' },
                'Hydraulic system calibration and function test': { id: 'hydcal', tier: 'std', desc: '液压系统校准与功能测试' },
                'Sea trial': { id: 'seatrial', tier: 'std', desc: '海试验证维保效果' },
                'Mechanical control gear': { id: 'mech', tier: 'opt', desc: '链条张紧、主启动阀/慢转阀、排气旁通阀' }
            };
            const SUBSYSTEMS = (typeof SGROUPS !== 'undefined' ? SGROUPS : []).map(function (code) {
                const m = SUB_META[code] || {};
                return {
                    id: m.id || ('grp_' + String(code).replace(/[^A-Za-z0-9]+/g, '_')),
                    name: code,                  // 显示后台原值（与后台服务项 grp 一致）
                    cat: code,                   // 精确匹配服务项 grp
                    tier: m.tier || 'opt',
                    desc: m.desc || ''
                };
            });
            // 兜底分组：项目分组选填（D2），未归类的服务项归入「其他」
            SUBSYSTEMS.push({ id: 'other', name: SI_OTHER_GROUP, cat: SI_OTHER_GROUP, tier: 'opt', desc: '未归类服务项（项目分组选填，可后补）' });

            // 注：demo 套餐 DEMO_PACKAGES 不再硬编码，改由后台 PACKAGES（PKG-STD）在 rebuildDemoPackages() 中重建

            // ===== 服务信息（D17，订单级必填）：是否紧急 / 服务地点 / 服务时间 =====
            // 与设备无关：切换设备/型号不清空（TC-R06）；改动任一项只重算「影响系数 → 最终报价」
            let svcInfo = null;   // {urg, region, country, site, date}；null = 默认（不紧急 / 第一个地区+国家）
            function svcIsoOf(t) {
                return t.getFullYear() + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + ('0' + t.getDate()).slice(-2);
            }
            function svcDefault() {
                const r0 = (typeof locRegions === 'function') ? (locRegions()[0] || '') : '';
                const c0 = r0 && typeof locCountries === 'function' ? (locCountries(r0)[0] || '') : '';
                return { urg: (typeof URGENT !== 'undefined' && URGENT[0] ? URGENT[0].key : 'no'), region: r0, country: c0, site: '', date: '' };
            }
            function svcEnsure() { if (!svcInfo) svcInfo = svcDefault(); return svcInfo; }
            // 距询价天数 = 服务日期 − 今天（自然日，当天 = 0；IN-INQ-05：前台 min=今天，负值防御性按 0）
            function svcLeadDays() {
                const s = svcEnsure();
                if (!s.date) return null;
                const d = new Date(s.date + 'T00:00:00');
                if (isNaN(d.getTime())) return null;
                const now = new Date(); now.setHours(0, 0, 0, 0);
                return Math.max(0, Math.round((d - now) / 86400000));
            }
            // 三维系数（R-41）：K = Max(紧急, 地点, 时间)，各未命中 = 1.0（取最大值，Q-9 已决）
            function svcCoef() {
                const s = svcEnsure();
                const u = (typeof urgentOf === 'function') ? urgentOf(s.urg) : { label: '不紧急', c: 1 };
                const l = (typeof locResolve === 'function') ? locResolve(s.region, s.country, s.site) : { c: 1, level: '未配置' };
                const days = svcLeadDays();
                const b = (days == null || typeof leadBandOf !== 'function') ? { c: 1, band: null } : leadBandOf(days);
                return { u: u, l: l, days: days, b: b, k: Math.max(u.c, l.c, b.c) };
            }
            function svcLocTxt() {
                const s = svcEnsure();
                return s.region + (s.country ? ' · ' + s.country : '') + (s.site ? ' · ' + s.site : '');
            }
            function svcHintUpdate() {
                if (!svcHintEl) return;
                const s = svcEnsure();
                // 客户侧不展示系数/构成：提示只做必填引导（R-36 口径扩展）
            }
            // 三级下拉渲染（后台配置联动：URGENT/LOCATIONS 变更后重画，保留已选值）
            function svcRenderOptions() {
                const s = svcEnsure();
                if (svcUrgSel) svcUrgSel.innerHTML = (typeof URGENT !== 'undefined' ? URGENT : []).map(function (u) {
                    return '<option value="' + u.key + '"' + (u.key === s.urg ? ' selected' : '') + '>' + u.label + '</option>';   // 系数不外显（R-36 口径扩展）
                }).join('');
                const regions = (typeof locRegions === 'function') ? locRegions() : [];
                if (svcRegionSel) svcRegionSel.innerHTML = regions.length
                    ? '<option value="">请选择地区</option>' + regions.map(function (r) {
                        return '<option value="' + r + '"' + (r === s.region ? ' selected' : '') + '>' + r + '</option>';
                    }).join('')
                    : '<option value="">（暂无地区配置）</option>';
                if (s.region && regions.indexOf(s.region) < 0) { s.region = regions[0] || ''; s.country = ''; s.site = ''; }
                const countries = s.region && typeof locCountries === 'function' ? locCountries(s.region) : [];
                if (svcCountrySel) svcCountrySel.innerHTML = '<option value="">请选择国家</option>' + countries.map(function (c) {
                    return '<option value="' + c + '"' + (c === s.country ? ' selected' : '') + '>' + c + '</option>';
                }).join('');
                if (s.country && countries.indexOf(s.country) < 0) { s.country = ''; s.site = ''; }
                const sites = (s.region && s.country && typeof locSites === 'function') ? locSites(s.region, s.country) : [];
                if (svcSiteSel) svcSiteSel.innerHTML = '<option value="">请选择地点（选填）</option>' + sites.map(function (t) {
                    return '<option value="' + t + '"' + (t === s.site ? ' selected' : '') + '>' + t + '</option>';
                }).join('');
                if (svcDateInp) { svcDateInp.min = svcIsoOf(new Date()); svcDateInp.value = s.date || ''; }
                if (window.SEL) SEL.syncAll();   // 升级后的 Select：选项重建后同步触发器文案
            }
            function svcBindEvents() {
                if (svcUrgSel) svcUrgSel.addEventListener('change', function () { svcEnsure().urg = this.value; svcHintUpdate(); updateLiveSummary(); });
                if (svcRegionSel) svcRegionSel.addEventListener('change', function () {
                    const s = svcEnsure(); s.region = this.value;
                    s.country = (typeof locCountries === 'function' ? locCountries(this.value)[0] : '') || '';
                    s.site = '';
                    svcRenderOptions(); svcHintUpdate();
                    renderItemsArea();   // 服务信息参与前置校验（R-21 扩展）：补齐后方案区/提交锁随动
                });
                if (svcCountrySel) svcCountrySel.addEventListener('change', function () {
                    const s = svcEnsure(); s.country = this.value; s.site = '';
                    svcRenderOptions(); svcHintUpdate();
                    renderItemsArea();
                });
                if (svcSiteSel) svcSiteSel.addEventListener('change', function () { svcEnsure().site = this.value; svcHintUpdate(); updateLiveSummary(); });
                if (svcDateInp) svcDateInp.addEventListener('change', function () { svcEnsure().date = this.value; svcHintUpdate(); renderItemsArea(); });
            }

            // ===== 工具函数 =====
            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }
            const fmtNum = n => Number(n).toLocaleString('en-US');

            function getCyl() {
                const v = parseInt((cylInput && cylInput.value) || '0', 10);
                return (isNaN(v) || v < 1) ? 1 : v;
            }
            // R-05 修订：缸数不再由型号自动带出，由客户手动填写（1–20 整数）
            function baseQtyOf(it) {
                return it.base_qty === '缸数' ? getCyl() : (parseInt(it.base_qty, 10) || 1);
            }
            // 客户手动调过的数量固定保留；未调过的随缸数等默认值实时变化
            function qtyOf(key, it) {
                return qtyTouched.has(key) ? quoteQty[key] : baseQtyOf(it);
            }
            function getSubsystemKeys(subId) {
                const sub = SUBSYSTEMS.find(function (s) { return s.id === subId; });
                if (!sub) return [];
                return SPECIAL_5Y_LEAVES.filter(function (it) { return it.cat === sub.cat; }).map(function (it) { return it.key; });
            }
            const STANDARD_SUBSYSTEM_IDS = ['hcu', 'elec', 'tacho', 'pneu', 'hydcal', 'seatrial'];
            // 严格以后台套餐 PKG-STD 的 SI 编码命中为准：命中即在套餐内（标准），否则为 Option
            function isStandardItem(key) {
                return PKG_KEY_SET.has(key);
            }

            // ===== 计价（以后台领域模型为准：标准工时 × 职级费率，D15/R-33；v1.14 去件数系数 D18） =====
            function priceCtx() {
                return {
                    mt: maintTypeCode(),
                    cycle: currentCycle(),
                    modelName: (model && model.value) || customModel || '',
                    cyl: getCyl()
                };
            }
            // 单项单价（按 1 单位）：后台标准工时两级回溯（型号级>设备级） → 人员配置费率 × 工时
            function itemUnitPrice(it) {
                const c = priceCtx();
                const r = resolveLaborStandard(it.siCode, c.modelName, c.mt, c.cycle);
                if (!r) return 0;
                const H = laborHoursOf(r.std, c.cyl);
                if (!H) return 0;
                return rateSumOf(r.std.crew, RATES.active.rates) * H;
            }
            // 单项行金额（v1.14 去件数系数，D18）：单价 × 数量（多件不再折减）
            function itemLinePrice(it, qty) {
                const unit = itemUnitPrice(it);
                if (!unit) return 0;
                return unit * qty;
            }

            // 项保底价（R-30，按一份计）：该项人员配置综合费率 × 最低计费工时（不乘数量/实际工时）
            function itemFloorPrice(it) {
                const c = priceCtx();
                const r = resolveLaborStandard(it.siCode, c.modelName, c.mt, c.cycle);
                if (!r) return 0;
                return rateSumOf(r.std.crew, RATES.active.rates) * (typeof PPARAMS !== 'undefined' && PPARAMS ? PPARAMS.minH : 8);
            }

            // 汇总计算（订单级）：明细合计 → 合计保底价 → 计价基数 → × 影响系数 → 最终报价（D16/D17）
            function calcTotals() {
                let stdUnit = 0, stdCount = 0;
                selectedItems.forEach(function (k) {
                    const it = ITEM_MAP[k];
                    if (it && isStandardItem(k)) {
                        stdUnit += itemLinePrice(it, qtyOf(k, it));
                        stdCount++;
                    }
                });
                // 套餐不再有份数（2026-09-10 评审）：套餐小计 = Σ(勾选明细行金额)
                const stdTotal = stdUnit;
                const optRows = [];
                let optTotal = 0;
                selectedItems.forEach(function (k) {
                    const it = ITEM_MAP[k];
                    if (it && !isStandardItem(k)) {
                        const inc = !quoteExcluded.has(k);
                        const q = qtyOf(k, it);
                        const line = itemLinePrice(it, q);
                        optRows.push({ key: k, it: it, inc: inc, qty: q, line: line });
                        if (inc) optTotal += line;
                    }
                });
                const detail = stdTotal + optTotal;
                /* 合计保底价：Σ(各已勾选且可计价服务项的项保底价)——套餐项 + 已勾选可选项 */
                const floorOn = (typeof PPARAMS !== 'undefined' && PPARAMS) ? !!PPARAMS.floorOn : true;
                let floorTotal = 0, floorN = 0;
                selectedItems.forEach(function (k) {
                    const it = ITEM_MAP[k];
                    if (!it) return;
                    if (!isStandardItem(k) && quoteExcluded.has(k)) return;   // 未勾选可选项不计入保底（R-30）
                    const f = itemFloorPrice(it);
                    if (f > 0) { floorTotal += f; floorN++; }
                });
                if (!floorOn) floorTotal = 0;
                const floorShortfall = Math.max(0, floorTotal - detail);
                const pricingBase = Math.max(floorTotal, detail);
                const co = svcCoef();
                const grand = Math.round(pricingBase * co.k * 100) / 100;
                return {
                    stdUnit: stdUnit, stdTotal: stdTotal, stdCount: stdCount,
                    optRows: optRows, optTotal: optTotal, optCount: optRows.length,
                    detail: detail,
                    floorOn: floorOn, floorTotal: floorTotal, floorN: floorN,
                    floorHours: (typeof PPARAMS !== 'undefined' && PPARAMS) ? PPARAMS.minH : 8,
                    floorShortfall: floorShortfall, pricingBase: pricingBase,
                    coef: co, grand: grand
                };
            }

            // ----- 文本取值 -----
            function getManufacturerText() {
                if (customManufacturer) return customManufacturer;
                return (manufacturer.selectedOptions[0] && manufacturer.value) ? manufacturer.selectedOptions[0].text : '';
            }
            function getModelText() {
                if (customModel) return customModel;
                return (model.selectedOptions[0] && model.value) ? model.selectedOptions[0].text : '';
            }
            function getMaintText() {
                return (maintType.selectedOptions[0] && maintType.value) ? maintType.selectedOptions[0].text : '';
            }
            function getDeviceLabel() {
                return selectedDeviceName || deviceType.value || '设备';
            }

            // ============================================================
            // 下拉搜索组合框（PC：键盘 ↑↓ 选择、回车确认、ESC 关闭）
            // ============================================================
            const _allPanels = [];

            function setupSearchSelect(selectEl, inputEl, panelEl, clearEl, beforeRender) {
                _allPanels.push(panelEl);
                const wrap = inputEl.closest('.search-select');
                let items = [];   // [{option, el}]
                let activeIdx = -1;

                function closeOtherPanels() {
                    _allPanels.forEach(function (p) {
                        if (p !== panelEl) {
                            p.style.display = 'none';
                            const w = p.closest('.search-select');
                            if (w) w.classList.remove('ss-open');
                        }
                    });
                }

                function setActive(i) {
                    activeIdx = i;
                    items.forEach(function (it, idx) {
                        it.el.classList.toggle('active', idx === i);
                        if (idx === i) it.el.scrollIntoView({ block: 'nearest' });
                    });
                }

                function pick(o) {
                    selectEl.value = o.value;
                    inputEl.value = o.textContent;
                    hidePanel();
                    syncInput();
                    selectEl.dispatchEvent(new Event('change'));
                }

                function buildItems(queryOverride) {
                    items = [];
                    panelEl.innerHTML = '';
                    // focus 打开面板时传 '' 显示全部；输入时按输入值过滤
                    const q = (queryOverride !== undefined ? queryOverride : (inputEl.value || '')).trim().toLowerCase();
                    function addOption(o) {
                        if (o.value === '') return;
                        if (q && o.textContent.toLowerCase().indexOf(q) === -1) return;
                        const div = document.createElement('div');
                        div.className = 'ss-option' + (o.value === selectEl.value ? ' selected' : '');
                        div.textContent = o.textContent;
                        div.addEventListener('mousedown', function (e) {
                            e.preventDefault();
                            pick(o);
                        });
                        div.addEventListener('mouseenter', function () {
                            setActive(items.findIndex(function (x) { return x.el === div; }));
                        });
                        panelEl.appendChild(div);
                        items.push({ option: o, el: div });
                    }
                    Array.prototype.forEach.call(selectEl.children, function (child) {
                        if (child.tagName === 'OPTGROUP') {
                            const gl = document.createElement('div');
                            gl.className = 'ss-group';
                            gl.textContent = child.label;
                            panelEl.appendChild(gl);
                            Array.prototype.forEach.call(child.children, addOption);
                        } else if (child.tagName === 'OPTION') {
                            addOption(child);
                        }
                    });
                    if (!items.length) {
                        const empty = document.createElement('div');
                        empty.className = 'ss-empty';
                        if (selectEl.id === 'manufacturer') empty.textContent = '请先选择设备型号';
                        else if (selectEl.id === 'model') empty.textContent = '暂无可选型号';
                        else empty.textContent = '无匹配结果';
                        panelEl.appendChild(empty);
                    }
                }

                function showPanel() {
                    if (selectEl.id === 'model' && selectEl.options.length <= 1) {
                        rebuildModelOptions();
                    }
                    if (beforeRender) beforeRender();
                    closeOtherPanels();
                    buildItems('');
                    setActive(items.findIndex(function (x) { return x.option.value === selectEl.value; }));
                    panelEl.style.display = 'block';
                    if (wrap) wrap.classList.add('ss-open');
                }

                function hidePanel() {
                    panelEl.style.display = 'none';
                    if (wrap) wrap.classList.remove('ss-open');
                }

                function syncInput() {
                    const sel = selectEl.selectedOptions[0];
                    inputEl.value = (sel && selectEl.value) ? sel.textContent : '';
                    const has = !!inputEl.value;
                    if (clearEl) clearEl.style.display = has ? 'flex' : 'none';
                    if (wrap) wrap.classList.toggle('has-value', has);
                }

                inputEl.addEventListener('focus', function () {
                    showPanel();
                    inputEl.select();
                });
                inputEl.addEventListener('input', function () {
                    if (beforeRender) beforeRender();
                    buildItems(inputEl.value);
                    setActive(items.length === 1 ? 0 : activeIdx);
                    panelEl.style.display = 'block';
                    if (wrap) wrap.classList.add('ss-open');
                });
                inputEl.addEventListener('blur', function () {
                    setTimeout(function () {
                        hidePanel();
                    }, 120);
                    syncInput();
                });
                inputEl.addEventListener('keydown', function (e) {
                    if (panelEl.style.display !== 'block') return;
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        if (items.length) setActive(Math.min(activeIdx + 1, items.length - 1));
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        if (items.length) setActive(Math.max(activeIdx - 1, 0));
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        if (activeIdx >= 0 && items[activeIdx]) pick(items[activeIdx].option);
                        else if (items.length === 1) pick(items[0].option);
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        hidePanel();
                        syncInput();
                    }
                });
                if (clearEl) {
                    clearEl.addEventListener('mousedown', function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        selectEl.value = '';
                        hidePanel();
                        syncInput();
                        selectEl.dispatchEvent(new Event('change'));
                    });
                }
                selectEl._syncInput = syncInput;
                syncInput();
            }

            // 点击面板外任意位置：关闭所有搜索面板（全局委托，避免每个实例重复注册监听）
            document.addEventListener('click', function (e) {
                _allPanels.forEach(function (p) {
                    const w = p.closest('.search-select');
                    if (w && !w.contains(e.target)) {
                        p.style.display = 'none';
                        w.classList.remove('ss-open');
                    }
                });
            });

            // ----- 型号 / 厂家联动（与 v8 一致） -----
            function rebuildModelOptions() {
                model.innerHTML = '<option value="">请选择设备型号</option>';
                const seen = {};
                Object.keys(SERIES_INFO).forEach(function (sn) {
                    (SERIES_INFO[sn].model_list || []).forEach(function (m) {
                        if (seen[m]) return; // 跨系列重名型号去重
                        seen[m] = true;
                        const o = document.createElement('option');
                        o.value = m;
                        o.textContent = m;
                        model.appendChild(o);
                    });
                });
                model.value = '';
                if (model._syncInput) model._syncInput();
                customModel = '';
                customModelInput.value = '';
            }

            function rebuildManufacturerByModel(preserve) {
                const modelVal = model.value || customModel;
                let manus = getManufacturersForModel(modelVal);
                if (!manus.length) manus = ALL_MANUFACTURERS.slice(); // 自定义/未知型号兜底
                const prev = manufacturer.value;
                manufacturer.innerHTML = '<option value="">请选择制造厂家</option>';
                manus.forEach(function (m) {
                    const o = document.createElement('option');
                    o.value = m;
                    o.textContent = m;
                    manufacturer.appendChild(o);
                });
                if (preserve && prev && manus.indexOf(prev) !== -1) {
                    manufacturer.value = prev;
                } else {
                    manufacturer.value = manus.length ? manus[0] : '';
                }
                if (manufacturer._syncInput) manufacturer._syncInput();
            }

            function refreshDeviceDependentDropdowns() {
                rebuildModelOptions();
                manufacturer.innerHTML = '<option value="">请选择制造厂家</option>';
                manufacturer.value = '';
                if (manufacturer._syncInput) manufacturer._syncInput();
                resetCustomFields();
            }

            function resetCustomFields() {
                customManufacturer = '';
                customModel = '';
                customNeed = '';
                customNeedInput.value = '';
                customManuInput.value = '';
                customModelInput.value = '';
                customAddModal.classList.remove('open');
            }

            function updateAddLinkVisibility() {
                addCustomLink.style.display = deviceType.value ? '' : 'none';
            }

            // ----- 缸数 -----
            function clampCyl() {
                if (cylInput.value === '') { renderItemsArea(); return; }
                let v = parseInt(cylInput.value, 10);
                if (isNaN(v)) { cylInput.value = ''; renderItemsArea(); return; }
                if (v < 1) v = 1;
                if (v > 20) v = 20;
                cylInput.value = v;
                renderItemsArea();
            }
            let cylTimer = null;
            cylInput.addEventListener('input', function () {
                clearTimeout(cylTimer);
                cylTimer = setTimeout(clampCyl, 300);
            });
            cylInput.addEventListener('blur', function () {
                clearTimeout(cylTimer);
                clampCyl();
            });
            document.querySelectorAll('.qty-cell button').forEach(btn => {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    let v = parseInt(cylInput.value, 10);
                    if (isNaN(v) || v < 0) v = 0;
                    if (this.classList.contains('cyl-inc')) {
                        v += 1;
                    } else {
                        v -= 1;
                        if (v < 1) {
                            cylInput.value = '';
                            cylInput.dispatchEvent(new Event('input'));
                            return;
                        }
                    }
                    if (v < 1) v = 1;
                    if (v > 20) v = 20;
                    cylInput.value = v;
                    cylInput.dispatchEvent(new Event('input'));
                });
            });

            // ============================================================
            // 前置校验 / 待办清单
            // ============================================================
            function computeFormMissing() {
                const list = [];
                if (!(model.value || customModel)) list.push('选择设备型号');
                if (!(manufacturer.value || customManufacturer)) list.push('选择制造厂家');
                if (!maintType.value) list.push('选择维保类型');
                if (maintCycleEnabled() && !maintCycleHours.value) list.push('选择保养周期');
                if (!(cylInput.value && String(cylInput.value).trim() !== '')) list.push('填写设备缸数');
                // R-21 扩展（D17）：服务信息三项齐备（地点到地区+国家；日期不早于当天）
                const s = svcEnsure();
                if (!s.region || !s.country) list.push('选择服务地点（地区 + 国家）');
                if (!s.date) list.push('选择服务时间');
                return list;
            }
            function hasPackagePrereqs() {
                return !!deviceType.value && computeFormMissing().length === 0;
            }
            function isFormValid() {
                return hasPackagePrereqs() && selectedItems.length > 0;
            }

            // ============================================================
            // STEP 1：维保方案渲染（套餐条 + 分组明细表）
            // ============================================================
            const pkgContainer = document.getElementById('packageContainer');

            // 根据必填项是否完成，控制「选择维保方案」面板、「查看预算」侧栏及整体布局
            function refreshSchemePanel() {
                const ready = hasPackagePrereqs();
                itemsArea.hidden = !ready;
                configAside.hidden = false; // 右侧始终展示：未就绪显示占位引导卡，避免大片空白
                updateAsideLocked();
                // 未就绪：显示占位引导卡；就绪：显示正式预算卡
                asideLocked.hidden = ready;
                asideReady.hidden = !ready;
            }

            // 刷新占位引导卡：已选设备 + 待办清单
            function updateAsideLocked() {
                if (lockDevice) lockDevice.textContent = getDeviceLabel();
                if (!lockTodo) return;
                const missing = computeFormMissing();
                if (missing.length === 0) {
                    lockTodo.innerHTML = '<li class="done">必填信息已完整 ✓</li>';
                } else {
                    lockTodo.innerHTML = missing.map(function (m) {
                        return '<li>' + escapeHtml(m) + '</li>';
                    }).join('');
                }
            }

            function renderItemsArea() {
                refreshSchemePanel();
                if (!hasPackagePrereqs()) {
                    renderLockedHint();
                    updateItemCount();
                    return;
                }
                // 展示规则回溯：命中则选中对应套餐；型号级/设备级均未命中 → 提示暂无维保方案数据（R-26），但仍展示后台建议的可选项
                const pkgCode = resolvePkgRule();
                if (pkgCode && DEMO_PACKAGES.some(function (p) { return p.id === pkgCode; })) {
                    noSchemeMode = false;
                    if (selectedPackage !== pkgCode) { selectPackage(pkgCode); return; }
                    renderPackageTable();
                    applyItemFilter();
                    updateItemCount();
                } else {
                    selectedPackage = '';
                    selectedItems = [];
                    PKG_KEY_SET = new Set();
                    noSchemeMode = true;
                    renderNoSchemeHint();
                    updateItemCount();
                }
            }

            function renderLockedHint() {
                pkgContainer.innerHTML =
                    '<div class="items-locked">' +
                    '完成上方必填信息后，维保方案将在此自动生成。</div>';
            }

            // 展示规则未命中（R-26）：当前型号/维保类型/周期没有匹配的套餐，引导客户咨询，而非默认展示兜底套餐
            // 若后台有可配置的可选项（RULES.sug 命中），仍展示「自由组合·Option」让客户单独勾选
            function renderNoSchemeHint() {
                if (!pkgContainer) return;
                const optKeySet = new Set();
                SUG_SET.forEach(function (k) { if (!PKG_KEY_SET.has(k)) optKeySet.add(k); });
                let html = '';
                if (optKeySet.size === 0) {
                    html = '<div class="items-locked">暂无维保方案数据，可咨询服务顾问为您报价。</div>';
                } else {
                    html = '<div class="items-locked">暂无标准维保套餐，您可单独勾选下列项目。</div>';
                    const optGrpKeys = {};
                    optKeySet.forEach(function (k) {
                        const it = ITEM_MAP[k];
                        if (!it) return;
                        (optGrpKeys[it.cat] = optGrpKeys[it.cat] || []).push(k);
                    });
                    const freeSubs = Object.keys(optGrpKeys).map(function (cat) {
                        return SUBSYSTEMS.find(function (s) { return s.cat === cat; }) || { id: 'opt_' + cat, name: cat, cat: cat, tier: 'opt', desc: '' };
                    });
                    html += '<div class="items-section">';
                    html += '<div class="items-sec-title">可选项目</div>';
                    html += '<table class="items-table"><thead><tr>';
                    html += '<th class="col-chk"></th><th>维修项目</th><th class="num">数量</th><th class="col-unit">单位</th>';
                    html += '</tr></thead>';
                    freeSubs.forEach(function (sub) { html += groupRowsHtml(sub, new Set(optGrpKeys[sub.cat])); });
                    html += '</table></div>';
                }
                pkgContainer.innerHTML = html;
            }

            function selectPackage(pkgId) {
                selectedPackage = pkgId;
                expandedPkg = pkgId;   // 默认展开明细，客户一眼看清套餐包含哪些项目
                selectedItems = [];
                if (pkgId) {
                    const pkg = DEMO_PACKAGES.find(function (p) { return p.id === pkgId; });
                    if (pkg) {
                        // 严格按后台套餐 PKG-STD 的 SI 编码命中的 key 选中
                        pkg.keys.forEach(function (k) {
                            if (selectedItems.indexOf(k) === -1) selectedItems.push(k);
                        });
                        PKG_KEY_SET = new Set(pkg.keys);   // 套餐内项目徽标随选中套餐刷新
                    }
                }
                renderPackageTable();
                applyItemFilter();
                updateItemCount();
            }

            function updatePackageSelection() {
                if (DEMO_PACKAGES.length === 0) return;
                // 多套餐下取"被选中 key 最多"的套餐作为当前选中套餐
                let best = null, bestCount = -1;
                DEMO_PACKAGES.forEach(function (pkg) {
                    const allKeys = pkg.keys.slice();
                    const selCount = allKeys.filter(function (k) { return selectedItems.indexOf(k) !== -1; }).length;
                    if (selCount > bestCount) { bestCount = selCount; best = pkg; }
                });
                selectedPackage = (best && bestCount > 0) ? best.id : '';
            }

            function changeQty(key, delta) {
                const it = ITEM_MAP[key];
                if (!it) return;
                if (quoteQty[key] == null) quoteQty[key] = baseQtyOf(it);
                quoteQty[key] = Math.max(1, quoteQty[key] + delta);
                qtyTouched.add(key);
                renderPackageTable();
                applyItemFilter();
                updateItemCount();
            }

            function groupRowsHtml(sub, onlyKeys) {
                let keys = getSubsystemKeys(sub.id);
                if (onlyKeys) keys = keys.filter(function (k) { return onlyKeys.has(k); });
                if (keys.length === 0) return '';   // 无可见项则跳过整组（严格分区：套餐项/Option 项不串组）
                const checkedKeys = keys.filter(function (k) { return selectedItems.indexOf(k) !== -1; });
                const allSel = keys.length > 0 && checkedKeys.length === keys.length;
                const partial = !allSel && checkedKeys.length > 0;
                const collapsed = collGrp.has(sub.id);
                const optOff = sub.tier === 'opt' && checkedKeys.length === 0;

                let h = '<tbody class="grp' + (collapsed ? ' collapsed' : '') + (optOff ? ' grp-opt-off' : '') + '" data-sub="' + sub.id + '" data-keys="' + escapeHtml(keys.join('|')) + '">';
                h += '<tr class="grp-head"><td colspan="4"><div class="grp-head-in">';
                h += '<span class="chk' + (allSel ? ' checked' : (partial ? ' partial' : '')) + (keys.length ? '' : ' disabled') + '"></span>';
                h += '<span class="grp-name" title="' + escapeHtml(sub.name + (sub.desc ? '：' + sub.desc : '')) + '">' + escapeHtml(sub.cat) + '</span>';
              
                h += '<span class="grp-count">' + checkedKeys.length + '/' + keys.length + '</span>';
                h += '<span class="grp-twist">' + (collapsed ? '▸' : '▾') + '</span>';
                h += '</div></td></tr>';
                keys.forEach(function (key) {
                    const it = ITEM_MAP[key];
                    if (!it) return;
                    const checked = selectedItems.indexOf(key) !== -1;
                    const qty = qtyOf(key, it);
                    h += '<tr class="it' + (checked ? ' checked' : '') + (optOff ? ' it-opt-off' : '') + '" data-item="' + escapeHtml(key) + '">';
                    h += '<td class="col-chk"><span class="chk' + (checked ? ' checked' : '') + '"></span></td>';
                    h += '<td class="col-name">' + escapeHtml(it.item_name);
                    if (SUG_SET.has(key)) h += '<span class="sug-badge" title="建议加选">建议加选</span>';
                    h += '</td>';
                    h += '<td class="num"><span class="qty-stepper">';
                    h += '<button type="button" class="qs-btn" data-qty-key="' + escapeHtml(key) + '" data-delta="-1"' + (optOff ? ' disabled' : '') + '>−</button>';
                    h += '<span class="qs-val">' + qty + '</span>';
                    h += '<button type="button" class="qs-btn" data-qty-key="' + escapeHtml(key) + '" data-delta="1"' + (optOff ? ' disabled' : '') + '>+</button>';
                    h += '</span></td>';
                    h += '<td class="muted-td col-unit">' + escapeHtml(it.unit) + '</td>';
                    h += '</tr>';
                });
                h += '</tbody>';
                return h;
            }

            function renderPackageTable() {
                if (!pkgContainer) return;
                if (SPECIAL_5Y_LEAVES.length === 0) {
                    renderNoSchemeHint();
                    return;
                }
                // R-26 状态：套餐未命中但已展示可选项，按 R-26 渲染（避免回退到 DEMO_PACKAGES[0] 误显示套餐）
                if (noSchemeMode) {
                    renderNoSchemeHint();
                    return;
                }
                const pkg = DEMO_PACKAGES.find(function (p) { return p.id === selectedPackage; }) || DEMO_PACKAGES[0];
                const sel = selectedPackage === pkg.id;

                const allKeys = pkg.keys.slice();   // 严格按后台套餐 PKG-STD 命中的 key 计数
                const checkedCount = allKeys.filter(function (k) { return selectedItems.indexOf(k) !== -1; }).length;
                const tableOpen = expandedPkg === pkg.id;

                let html = '';
                // 套餐选择条
                html += '<div class="pkg-strip' + (sel ? ' selected' : '') + '" id="pkgStrip">';
                html += '<span class="pkg-radio"></span>';
                html += '<div class="pkg-info">';
                html += '<div class="pkg-line1"><span class="pkg-name">' + escapeHtml(pkg.name) + '</span>';
                if (pkg.recommend) html += '<span class="badge badge-blue">推荐</span>';
                html += '<span class="pkg-count">已选 ' + checkedCount + '/' + allKeys.length + ' 项</span></div>';
                html += '<div class="pkg-desc">' + escapeHtml(pkg.desc) + '</div>';
                html += '</div>';
                html += '<button type="button" class="btn btn-outline btn-sm" id="pkgToggleBtn">' + (tableOpen ? '套餐收起' : '套餐展开') + '</button>';
                html += '</div>';

                if (tableOpen) {
                    // 套餐内项目（仅此区块受“收起/展开明细”控制）
                    html += '<div class="items-section">';
                    html += '<div class="items-sec-title">套餐内项目</div>';
                    html += '<table class="items-table"><thead><tr>';
                    html += '<th class="col-chk"></th><th>维修项目</th><th class="num">数量</th><th class="col-unit">单位</th>';
                    html += '</tr></thead>';
                    // 套餐内项目：仅渲染后台套餐PKG-STD命中的项（按子系统折叠展示）
                    const pkgKeySet = PKG_KEY_SET;
                    SUBSYSTEMS.forEach(function (sub) {
                        const ks = getSubsystemKeys(sub.id);
                        if (ks.some(function (k) { return pkgKeySet.has(k); })) html += groupRowsHtml(sub, pkgKeySet);
                    });
                    html += '</table></div>';
                }

                // 自由组合 Option：严格以后台「建议项规则(RULES.sug)」配置的可选项为准
                // 只展示后台命中的建议项（已含在标准套餐内的除外），不自行扩展其他项
                const optKeySet = new Set();
                SUG_SET.forEach(function (k) { if (!PKG_KEY_SET.has(k)) optKeySet.add(k); });
                const optGrpKeys = {};
                optKeySet.forEach(function (k) {
                    const it = ITEM_MAP[k];
                    if (!it) return;
                    (optGrpKeys[it.cat] = optGrpKeys[it.cat] || []).push(k);
                });
                // 按服务项分组归类；SUBSYSTEMS 未覆盖的分组用兜底子系统（tier=opt）渲染，确保一定显示
                const freeSubs = Object.keys(optGrpKeys).map(function (cat) {
                    return SUBSYSTEMS.find(function (s) { return s.cat === cat; }) || { id: 'opt_' + cat, name: cat, cat: cat, tier: 'opt', desc: '' };
                });
                if (freeSubs.length > 0) {
                    html += '<div class="items-section">';
                    html += '<div class="items-sec-title">可选项目</div>';
                    html += '<table class="items-table"><thead><tr>';
                    html += '<th class="col-chk"></th><th>维修项目</th><th class="num">数量</th><th class="col-unit">单位</th>';
                    html += '</tr></thead>';
                    freeSubs.forEach(function (sub) { html += groupRowsHtml(sub, new Set(optGrpKeys[sub.cat])); });
                    html += '</table></div>';
                }

                pkgContainer.innerHTML = html;
            }

            // 维修项筛选（与 v8 applyItemFilter 一致）
            function applyItemFilter() {
                const keyword = (itemSearch.value || '').trim().toLowerCase();
                const cats = pkgContainer.querySelectorAll('tbody.grp');
                cats.forEach(function (catEl) {
                    const rows = catEl.querySelectorAll('tr.it');
                    let anyVisible = false;
                    rows.forEach(function (rowEl) {
                        const name = (rowEl.querySelector('.col-name') || {}).textContent || '';
                        if (!keyword || name.toLowerCase().indexOf(keyword) !== -1) {
                            rowEl.classList.remove('hidden');
                            anyVisible = true;
                        } else {
                            rowEl.classList.add('hidden');
                        }
                    });
                    if (anyVisible || (!keyword && rows.length > 0)) {
                        catEl.classList.remove('hidden');
                    } else {
                        catEl.classList.add('hidden');
                    }
                });
                itemSearchClear.classList.toggle('show', !!keyword);
            }
            itemSearch.addEventListener('input', applyItemFilter);
            itemSearchClear.addEventListener('click', function () {
                itemSearch.value = '';
                applyItemFilter();
                itemSearch.focus();
            });

            // 明细表事件（委托，重渲染后依然有效）
            pkgContainer.addEventListener('click', function (e) {
                const qtyBtn = e.target.closest('.qs-btn');
                if (qtyBtn) {
                    e.stopPropagation();
                    changeQty(qtyBtn.getAttribute('data-qty-key'), parseInt(qtyBtn.getAttribute('data-delta'), 10));
                    return;
                }
                const toggleBtn = e.target.closest('#pkgToggleBtn');
                if (toggleBtn) {
                    e.stopPropagation();
                    expandedPkg = expandedPkg === selectedPackage ? '' : selectedPackage;
                    renderPackageTable();
                    applyItemFilter();
                    return;
                }
                const strip = e.target.closest('#pkgStrip');
                if (strip) {
                    const pkgId = selectedPackage || (DEMO_PACKAGES[0] && DEMO_PACKAGES[0].id) || 'standard';
                    if (selectedPackage === pkgId) {
                        selectedPackage = '';
                        selectedItems = [];
                    } else {
                        selectPackage(pkgId);
                        return;
                    }
                    renderPackageTable();
                    applyItemFilter();
                    updateItemCount();
                    return;
                }
                const grpHead = e.target.closest('.grp-head-in');
                if (grpHead) {
                    if (e.target.classList.contains('grp-twist')) {
                        const tbody = grpHead.closest('tbody.grp');
                        const sid = tbody.getAttribute('data-sub');
                        if (collGrp.has(sid)) collGrp.delete(sid); else collGrp.add(sid);
                        renderPackageTable();
                        applyItemFilter();
                        return;
                    }
                    const tbodyEl = grpHead.closest('tbody.grp');
                    const keys = (tbodyEl.getAttribute('data-keys') || '').split('|').filter(function (x) { return !!x; });
                    const allSel = keys.length > 0 && keys.every(function (k) { return selectedItems.indexOf(k) !== -1; });
                    if (allSel) {
                        selectedItems = selectedItems.filter(function (k) { return keys.indexOf(k) === -1; });
                    } else {
                        keys.forEach(function (k) { if (selectedItems.indexOf(k) === -1) selectedItems.push(k); });
                    }
                    updatePackageSelection();
                    renderPackageTable();
                    applyItemFilter();
                    updateItemCount();
                    return;
                }
                const itemRow = e.target.closest('tr.it');
                if (itemRow) {
                    const key = itemRow.getAttribute('data-item');
                    if (selectedItems.indexOf(key) !== -1) {
                        selectedItems = selectedItems.filter(function (v) { return v !== key; });
                    } else {
                        selectedItems.push(key);
                    }
                    updatePackageSelection();
                    renderPackageTable();
                    applyItemFilter();
                    updateItemCount();
                }
            });

            // ============================================================
            // 右侧实时报价（STEP 1 吸顶侧栏）
            // ============================================================
            function updateItemCount() {
                setSubmitLock();
                updateLiveSummary();
            }

            // 锁定态保留禁用外观但可点击，点击时给出引导反馈（真 disabled 无法触发任何事件）
            function setSubmitLock() {
                const locked = !isFormValid();
                step2Push.classList.toggle('is-locked', locked);
                step2Push.setAttribute('aria-disabled', locked ? 'true' : 'false');
            }

            function isSubmitLocked() {
                return step2Push.classList.contains('is-locked');
            }

            // 点击锁定按钮时，让右侧占位卡脉冲提示待办位置
            function pulseLockedCard() {
                const card = document.getElementById('asideLocked');
                if (!card || card.hidden) return;
                card.classList.remove('pulse');
                void card.offsetWidth; // 重排以重启动画
                card.classList.add('pulse');
                setTimeout(function () { card.classList.remove('pulse'); }, 1100);
            }

            function updateLiveSummary() {
                const t = calcTotals();
                const ship = (shipName.value || '').trim();
                let deviceLine = getDeviceLabel() + (ship ? '（' + ship + '）' : '');
                if (!deviceType.value) deviceLine = '尚未选择设备';
                sumDevice.innerHTML = '<b>' + escapeHtml(deviceLine) + '</b>' +
                    (getModelText() ? '<br>' + escapeHtml([getManufacturerText(), getModelText()].filter(Boolean).join(' · ') +
                        (cylInput.value ? ' · ' + getCyl() + ' 缸' : '') + (getMaintText() ? ' · ' + getMaintText() : '')) : '');

                const hasSel = selectedItems.length > 0;
                sumGrandRow.style.display = hasSel ? '' : 'none';
                if (!hasSel) return;
                // 客户侧仅展示最终报价（R-36 口径扩展）：明细合计/保底价/影响系数不外显，构成冻结进快照供后台与销售视图
                sumGrand.textContent = '$' + fmtNum(Math.round(t.grand));
            }

            // ============================================================
            // 事件绑定（与 v8 语义一致）
            // ============================================================
            function onDeviceChange() {
                selectedItems = [];
                selectedPackage = '';
                expandedPkg = '';
                quoteExcluded.clear();
                quoteQty = {};
                qtyTouched.clear();
                collGrp.clear();
                cycleFieldGroup.style.display = 'none';
                loadEquipmentData(deviceType.value);
                refreshDeviceDependentDropdowns();
                renderItemsArea();
                updateAddLinkVisibility();
            }

            maintType.addEventListener('change', function () {
                cycleFieldGroup.style.display = maintCycleEnabled() ? '' : 'none';
                rebuildSugSet();   // 维保类型变化 → 建议项集合随之刷新
                renderItemsArea();
                updateAddLinkVisibility();
            });

            maintCycleHours.addEventListener('change', function () {
                rebuildSugSet();   // 保养周期变化 → 建议项集合随之刷新
                renderItemsArea();
            });

            manufacturer.addEventListener('change', function () {
                renderItemsArea();
            });

            model.addEventListener('change', function () {
                rebuildManufacturerByModel(false);
                selectedItems = [];
                selectedPackage = '';
                quoteExcluded.clear();
                quoteQty = {};
                qtyTouched.clear();
                renderItemsArea();
                updateAddLinkVisibility();
            });

            // ----- 自定义厂家/型号弹窗 -----
            function openCustomAdd() {
                customManuInput.value = customManufacturer;
                customModelInput.value = customModel;
                customNeedInput.value = customNeed;
                customAddModal.classList.add('open');
                setTimeout(() => customManuInput.focus(), 50);
            }
            function closeCustomAdd() {
                customAddModal.classList.remove('open');
            }
            function confirmCustomAdd() {
                const manuVal = customManuInput.value.trim();
                const modelVal = customModelInput.value.trim();
                const needVal = customNeedInput.value.trim();
                if (!manuVal && !modelVal) { customManuInput.focus(); return; }
                customManufacturer = manuVal;
                customModel = modelVal;
                customNeed = needVal;
                closeCustomAdd();
                renderItemsArea();
                updateAddLinkVisibility();
                showToast('需求已提交，我们会尽快与您联系。', 'success');
            }
            addCustomLink.addEventListener('click', openCustomAdd);
            customAddConfirm.addEventListener('click', confirmCustomAdd);
            customAddCancel.addEventListener('click', closeCustomAdd);
            customAddClose.addEventListener('click', closeCustomAdd);
            customAddModal.addEventListener('click', function (e) {
                if (e.target === customAddModal) closeCustomAdd();
            });
            customModelInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') confirmCustomAdd();
            });

            // ----- Toast -----
            let toastTimer = null;
            function showToast(message, type, duration) {
                type = type || 'info';
                duration = duration || 3000;
                toastText.textContent = message;
                toast.classList.remove('info', 'success');
                toast.classList.add(type);
                toast.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function () {
                    toast.classList.remove('show');
                }, duration);
            }

            // ============================================================
            // 提交冻结（R-23）：组装询价单快照，写入共享存储供后台「客户定价单」展示
            // ============================================================
            function freezeInquiryRecord() {
                const c = priceCtx();
                const t0 = calcTotals();
                function laborOf(it) {
                    try {
                        const r = resolveLaborStandard(it.siCode, c.modelName, c.mt, c.cycle);
                        if (!r || !r.std) return null;
                        const H = laborHoursOf(r.std, c.cyl);
                        if (!H) return null;
                        const rates = (typeof RATES !== 'undefined' && RATES.active) ? RATES.active.rates : null;
                        const crew = r.std.crew || {};
                        const crewTxt = Object.keys(crew).map(function (k) { return k + '×' + crew[k]; }).join('+');
                        return { level: r.level, crew: crewTxt, rateSum: rateSumOf(crew, rates), hours: H };
                    } catch (e) { return null; }
                }
                const lines = [];
                selectedItems.forEach(function (k) {
                    const it = ITEM_MAP[k];
                    if (!it) return;
                    const std = isStandardItem(k);
                    if (!std && quoteExcluded.has(k)) return;   // 未勾选的可选项不进快照
                    const qty = qtyOf(k, it);
                    lines.push({
                        type: std ? 'package' : 'optional',
                        name: it.item_name, unit: it.unit || '',
                        unitPrice: Math.round(itemUnitPrice(it)),
                        qty: qty,
                        amount: Math.round(itemLinePrice(it, qty)),
                        labor: laborOf(it)
                    });
                });
                const pkgName = (typeof PACKAGES !== 'undefined'
                    ? ((PACKAGES.find(function (p) { return p.code === 'PKG-STD'; }) || {}).name) : '') || '标准保养';
                // 服务信息与新价格构成随快照冻结（R-23 / IN-INQ-06）：调系数不影响历史单
                const co = t0.coef;
                const s = svcEnsure();
                return {
                    no: '', at: 0, atTxt: '', src: 'PC',
                    customer: null,   // demo 无登录态；正式系统取登录快照（表设计 inquiry）
                    shipName: (shipName.value || '').trim(),
                    deviceName: getDeviceLabel(),
                    deviceCode: (typeof EQUIPMENT_NAME !== 'undefined' && typeof EQUIP_DEV !== 'undefined' && EQUIP_DEV[EQUIPMENT_NAME]) || '',
                    modelName: getModelText(), modelCustom: !!customModel,
                    cyl: getCyl(),
                    manufacturer: getManufacturerText(), manufacturerCustom: !!customManufacturer,
                    maintTypeCode: maintTypeCode() || '', maintTypeName: getMaintText(),
                    cycle: currentCycle() || null,
                    currency: 'USD', remarks: (priceFeedbackInput.value || '').trim(),
                    stdPkg: t0.stdCount ? { name: pkgName, subtotal: Math.round(t0.stdTotal) } : null,
                    lines: lines,
                    svc: {
                        urgKey: s.urg, urgency: co.u.label, urgC: co.u.c,
                        region: s.region, country: s.country, site: s.site,
                        locC: co.l.c, locLevel: co.l.level, locTxt: svcLocTxt(),
                        serviceDate: s.date, leadDays: co.days == null ? 0 : co.days, leadC: co.b.c,
                        leadNote: co.b && co.b.band ? (co.b.band.note || '') : ''
                    },
                    detailTotal: Math.round(t0.detail),
                    floorHours: t0.floorHours, floorTotal: Math.round(t0.floorTotal), floorN: t0.floorN,
                    floorShortfall: Math.round(t0.floorShortfall), pricingBase: Math.round(t0.pricingBase),
                    coefficient: co.k,
                    grand: Math.round(t0.grand)
                };
            }

            // ----- 步骤按钮 -----
            step2Push.addEventListener('click', function () {
                if (isSubmitLocked()) {
                    if (!hasPackagePrereqs()) {
                        showToast('请先完成左侧必填信息（见右侧待办清单）', 'info', 3000);
                        pulseLockedCard();
                    } else {
                        showToast('请至少勾选一项维保项目后再提交', 'info', 3000);
                    }
                    return;
                }
                let rec = null;
                try { rec = freezeInquiryRecord(); } catch (e) { rec = null; }   // 冻结失败不阻断提交主流程
                if (rec) {
                    INQStore.list().then(function (list) {
                        rec.no = INQStore.nextNo(list);
                        const st = INQStore.stamp();
                        rec.at = st.at; rec.atTxt = st.atTxt;
                        return INQStore.save(rec);
                    }).then(function (saved) {
                        showToast('提交成功！询价单号 ' + saved.no + '，我们会尽快回复您。', 'success', 4000);
                    }).catch(function () {
                        showToast('提交成功！我们会尽快回复您。', 'success', 4000);
                    });
                } else {
                    showToast('提交成功！我们会尽快回复您。', 'success', 4000);
                }
                resetAll();
            });

            // ----- Reset（与 v8 resetAll 语义一致）-----
            function resetAll() {
                selectedItems = [];
                quoteExcluded.clear();
                quoteQty = {};
                qtyTouched.clear();
                priceFeedbackInput.value = '';
                shipName.value = '';
                deviceType.value = '';
                selectedDeviceName = '';
                maintType.value = '';
                if (maintType._syncInput) maintType._syncInput();
                cylInput.value = '';
                resetCustomFields();
                selectedPackage = '';
                expandedPkg = '';
                collGrp.clear();
                cycleFieldGroup.style.display = 'none';
                svcInfo = null;            // 服务信息回默认（不紧急 / 第一个地区+国家；日期清空）
                svcRenderOptions();
                svcHintUpdate();
                refreshDeviceDependentDropdowns();
                updateAddLinkVisibility();
                pkgContainer.innerHTML = '';
                updateItemCount();
                clearSelection();

                cascadeSearchClear.classList.remove('show');
                cascadeEmpty.classList.remove('show');
