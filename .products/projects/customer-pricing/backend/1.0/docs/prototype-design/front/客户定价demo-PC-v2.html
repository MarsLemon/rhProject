            // ============================================================
            // STEP 0：设备目录（分类数据 = v8 标准目录；展示：电商分类视图，左侧一级分类导航 + 右侧层级缩进分组）
            // ============================================================
            // 分类数据 = demov8 原始目录结构（机械设备主要部件：推进用柴油机 / 发电用电动机装置）
            // 设备分类树（4 级：一级 → 二级 → 三级 → 四级叶子）。与参考站分类大厅一致，多一级分组扁平平铺。
            function T(code, cn, en, children) {
                return { level: 1, code: code, cn_name: cn, en_name: en, children: children };
            }

            function S(code, cn, en, children) {
                return { level: 2, code: code, cn_name: cn, en_name: en, children: children };
            }

            function G(code, cn, en, children) {
                return { level: 3, code: code, cn_name: cn, en_name: en, children: children };
            }

            function L(code, cn, en, eq) {
                const leaf = { level: 4, code: code, cn_name: cn, en_name: en };
                if (eq) {
                    leaf.equipment_name = eq;
                    leaf.all_maintenance_types = (EQUIPMENT_DATA[eq] || {}).all_maintenance_types || [];
                    leaf.equipment_series = (EQUIPMENT_DATA[eq] || {}).equipment_series || [];
                }
                return leaf;
            }

            const TREE = [
                T("6", "机械设备主要部件", "MACHINERY MAIN COMPONENTS", [
                    S("60", "推进用柴油机", "DIESEL ENGINES FOR PROPULSION", [
                        G("601", "柴油机", "DIESEL ENGINES", [
                            L("601.001", "主机柴油机", "Main diesel engine", "Main diesel engine")
                        ])
                    ]),
                    S("65", "发电用电动机装置", "MOTOR AGGREGATES FOR MAIN ELECTRIC POWER PRODUCTION", [
                        G("651", "电动机装置", "MOTOR AGGREGATES", [
                            L("651.001", "辅助柴油发电机组", "Aux. diesel generator aggregates, complete", "Aux. diesel generator aggregates, complete")
                        ])
                    ])
                ])
            ];



            const cascadeSearch = document.getElementById('cascadeSearch');
            const cascadeSearchClear = document.getElementById('cascadeSearchClear');
            const cascadeEmpty = document.getElementById('cascadeEmpty');
            const searchResults = document.getElementById('searchResults');
            const mallWrap = document.getElementById('mallWrap');
            const mallGroups = document.getElementById('mallGroups');
            const productView = document.getElementById('productView');
            const pvGrid = document.getElementById('pvGrid');
            const pvCrumb = document.getElementById('pvCrumb');
            const treeView = document.getElementById('treeView');
            const mallLeftRoots = document.getElementById('mallLeftRoots');
            const hallEntry = document.getElementById('hallEntry');
            const catalogSplit = document.querySelector('.catalog-split');
            // 当前商品展示视图所属的三级分类（level 3 节点）
            let pvGroupNode = null;

            function collectLeaves(nodes, trail) {
                let result = [];
                nodes.forEach(function (n) {
                    const t = trail.concat(n);
                    if (!n.children || !n.children.length) {
                        result.push({ node: n, path: t });
                    } else {
                        result = result.concat(collectLeaves(n.children, t));
                    }
                });
                return result;
            }
            const ALL_LEAVES = collectLeaves(TREE, []);

            function buildPathText(leaf, field) {
                const f = field || 'cn_name';
                const names = [];
                (function find(nodes, trail) {
                    for (const n of nodes) {
                        const t = trail.concat(n[f] || n.cn_name);
                        if (n === leaf) { names.push(...t); return true; }
                        if (n.children && find(n.children, t)) return true;
                    }
                    return false;
                })(TREE, []);
                return names;
            }

            // 统一选择入口：同步 电商视图 chip / 商品卡片 高亮 + 联动下方维保需求
            function selectLeafNode(node) {
                selectedLeaf = node;
                mallGroups.querySelectorAll('.selected').forEach(function (c) { c.classList.remove('selected'); });
                pvGrid.querySelectorAll('.selected').forEach(function (c) { c.classList.remove('selected'); });
                const chipEl = mallGroups.querySelector('[data-code="' + node.code + '"]');
                if (chipEl) {
                    chipEl.classList.add('selected');
                    chipEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
                const cardEl = pvGrid.querySelector('[data-code="' + node.code + '"]');
                if (cardEl) {
                    cardEl.classList.add('selected');
                    cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
                applySelectedDevice(node);
            }

            // 选中设备后立即联动：填充表单 + 更新实时报价（单页模式无需"填写维保需求"按钮）
            function applySelectedDevice(node) {
                if (!node) return;
                const eqName = node.equipment_name;
                if (!eqName || !EQUIPMENT_DATA[eqName]) {
                    // 该设备暂无维保数据：引导人工报价，不进入表单
                    showToast('「' + node.cn_name + '」的维保数据整理中，可提交需求由人工报价。', 'info', 3500);
                    openCustomAdd();
                    return;
                }
                selectedDeviceName = node.en_name || node.cn_name || eqName;
                deviceType.value = eqName;
                onDeviceChange();
                renderItemsArea();
                updateItemCount();
                // 选中设备后自动进入第二页（填写维保需求）
                goToStep(1);
            }

            function clearSelection() {
                mallGroups.querySelectorAll('.selected').forEach(function (c) { c.classList.remove('selected'); });
                selectedLeaf = null;
            }

            // 恢复目录区可见性（分类大厅视图，隐藏 悬浮树 / 商品展示）
            function restoreCatalogView() {
                catalogSplit.style.display = '';
                mallWrap.style.display = '';
                productView.style.display = 'none';
                treeView.style.display = 'none';
                mallGroups.style.display = '';
                mallLeftRoots.querySelectorAll('.ml-root').forEach(function (r) { r.classList.remove('active'); });
            }

            // 商品展示视图：渲染商品卡片网格（仅展示设备名称，每行 4 个）

            function pvCard(node) {
                const card = document.createElement('div');
                card.className = 'pv-card' + (selectedLeaf === node ? ' selected' : '');
                card.dataset.code = node.code;
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.setAttribute('aria-label', node.cn_name + ' ' + (node.en_name || ''));
                const name = document.createElement('div');
                name.className = 'pv-name';
                const ne = document.createElement('div');
                ne.className = 'pv-name-en';
                ne.textContent = node.en_name || node.cn_name;
                name.appendChild(ne);
                const nc = document.createElement('div');
                nc.className = 'pv-name-cn';
                nc.textContent = node.cn_name || '';
                name.appendChild(nc);
                card.appendChild(name);
                function pick() {
                    selectLeafNode(node);
                }
                card.addEventListener('click', pick);
                card.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
                });
                return card;
            }

            // 进入商品展示视图（点击三级分类 DIESEL ENGINES 等）
            function openProductView(sec, group) {
                pvGroupNode = group;
                const leaves = flattenLeaves(group);
                pvGrid.innerHTML = '';
                leaves.forEach(function (lf) { pvGrid.appendChild(pvCard(lf)); });
                // 分类层级路径：全部分类 › 一级 › 二级 › 三级（三级高亮为当前位置）
                renderPvCrumb(rootOf(group), sec, group);
                mallGroups.style.display = 'none';
                treeView.style.display = 'none';
                productView.style.display = 'flex';
                // 若当前已选中叶子且属于该三级分类，高亮对应卡片
                if (selectedLeaf) {
                    const cardEl = pvGrid.querySelector('[data-code="' + selectedLeaf.code + '"]');
                    if (cardEl) cardEl.classList.add('selected');
                }
            }

            // 商品展示顶部：可点击面包屑（全部分类 › 一级 › 二级 › 当前三级）
            // 上级层级点击后回到对应层级的分类树，当前层级高亮不可点
            function renderPvCrumb(root, sec, group) {
                pvCrumb.innerHTML = '';
                const mkSep = function () {
                    const sep = document.createElement('span');
                    sep.className = 'pc-sep';
                    sep.textContent = '/';
                    pvCrumb.appendChild(sep);
                };
                const mkCrumb = function (label, onClick, current) {
                    const item = document.createElement('button');
                    item.type = 'button';
                    item.className = 'pc-item' + (current ? ' pc-current' : '');
                    item.textContent = label;
                    item.title = label; // 被收缩出省略号时悬停可看全名
                    if (onClick) item.addEventListener('click', onClick);
                    pvCrumb.appendChild(item);
                };
                mkCrumb('全部分类', function () { backToHall(group); });
                mkSep();
                mkCrumb(root.en_name || root.cn_name, function () { openTreeViewOf(root); });
                mkSep();
                mkCrumb(sec.en_name || sec.cn_name, function () { openTreeViewOf(sec); });
                mkSep();
                mkCrumb(group.en_name || group.cn_name, null, true);
            }

            // 面包屑逐级返回：退出商品展示，显示该层级（一级/二级）下的分类树，左侧栏同步高亮
            function openTreeViewOf(node) {
                productView.style.display = 'none';
                pvGroupNode = null;
                const root = rootOf(node);
                const rootBtn = mallLeftRoots.querySelector('[data-code="' + root.code + '"]');
                showTreeOf(node, rootBtn, true);
            }

            function backToHall(targetNode) {
                restoreCatalogView();
                if (targetNode) {
                    const el = mallGroups.querySelector('[data-code="' + targetNode.code + '"]');
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            // ===== 面板左侧一级分类：悬停右侧浮现树；点击三级进入商品展示 =====
            // 渲染左侧竖排一级分类
            function renderLeftRoots() {
                mallLeftRoots.innerHTML = '';
                TREE.forEach(function (root) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'ml-root';
                    btn.dataset.code = root.code;
                    const en = document.createElement('span');
                    en.className = 'ml-en';
                    en.textContent = root.en_name || root.cn_name;
                    btn.appendChild(en);
                    const cn = document.createElement('span');
                    cn.className = 'ml-cn';
                    cn.textContent = root.cn_name || '';
                    btn.appendChild(cn);
                    const arrow = document.createElement('span');
                    arrow.className = 'ml-arrow';
                    arrow.textContent = '>';
                    btn.appendChild(arrow);
                    btn.addEventListener('mouseenter', function () { showLeftTree(root, btn); });
                    mallLeftRoots.appendChild(btn);
                });
            }

            // 显示分类树视图：node 为一级（渲染其下全部二级+三级）或二级（仅渲染该二级下的三级）
            // fromLeft=true 表示来自左侧栏（高亮左侧按钮）；否则来自分类大厅标题按钮
            function showTreeOf(node, btn, fromLeft) {
                if (productView.style.display === 'flex') return; // 商品展示中不覆盖
                if (fromLeft) {
                    mallLeftRoots.querySelectorAll('.ml-root').forEach(function (r) { r.classList.remove('active'); });
                    btn.classList.add('active');
                }
                mallGroups.style.display = 'none';
                treeView.style.display = '';
                treeView.innerHTML = '';

                const secs = (node.level === 2) ? [node] : (node.children || []);
                secs.forEach(function (sec) {
                    const secEl = document.createElement('div');
                    secEl.className = 'tv-sec';
                    const secTitle = document.createElement('div');
                    secTitle.className = 'tv-sec-title';
                    const se = document.createElement('span');
                    se.textContent = sec.en_name || sec.cn_name;
                    secTitle.appendChild(se);
                    const sc = document.createElement('span');
                    sc.className = 'tv-sec-cn';
                    sc.textContent = sec.cn_name || '';
                    secTitle.appendChild(sc);
                    secEl.appendChild(secTitle);
                    const groups = document.createElement('div');
                    groups.className = 'tv-groups';
                    (sec.children || []).forEach(function (grp) {
                        const chip = document.createElement('button');
                        chip.type = 'button';
                        chip.className = 'tv-link';
                        chip.dataset.code = grp.code;
                        const ge = document.createElement('span');
                        ge.className = 'tv-group-en';
                        ge.textContent = grp.en_name || grp.cn_name;
                        chip.appendChild(ge);
                        const gc = document.createElement('span');
                        gc.className = 'tv-group-cn';
                        gc.textContent = grp.cn_name || '';
                        chip.appendChild(gc);
                        // 选了分类后统一进入商品展示（设备页面），由用户在设备页面选择具体设备
                        chip.addEventListener('click', function () {
                            openProductView(sec, grp);
                        });
                        groups.appendChild(chip);
                    });
                    secEl.appendChild(groups);
                    treeView.appendChild(secEl);
                });
            }

            // 悬停左侧一级分类：右侧浮现该分类的树（fromLeft 高亮左侧按钮）
            function showLeftTree(root, btn) {
                showTreeOf(root, btn, true);
            }

            // 左侧「全部商品分类」→ 进入分类大厅
            hallEntry.addEventListener('click', function () {
                restoreCatalogView();
                // 若搜索态，清空恢复
                if (cascadeSearch.value) {
                    cascadeSearch.value = '';
                    cascadeSearchClear.classList.remove('show');
                    searchResults.style.display = 'none';
                    searchResults.innerHTML = '';
                    cascadeEmpty.classList.remove('show');
                }
            });

            renderLeftRoots();

            function applyCascadeSearch(rawQuery) {
                const query = (rawQuery || '').trim();
                if (!query) {
                    searchResults.style.display = 'none';
                    cascadeEmpty.classList.remove('show');
                    cascadeSearchClear.classList.remove('show');
                    restoreCatalogView();
                    return;
                }
                cascadeSearchClear.classList.add('show');
                catalogSplit.style.display = 'none';
                searchResults.innerHTML = '';
                const q = query.toLowerCase();
                const matched = ALL_LEAVES.filter(function (item) {
                    return (item.node.cn_name || '').toLowerCase().indexOf(q) >= 0 ||
                        (item.node.en_name || '').toLowerCase().indexOf(q) >= 0;
                });
                if (!matched.length) {
                    cascadeEmpty.classList.add('show');
                    searchResults.style.display = 'none';
                    return;
                }
                cascadeEmpty.classList.remove('show');
                searchResults.style.display = 'flex';
                matched.forEach(function (item) {
                    const div = document.createElement('div');
                    div.className = 'sr-item';
                    const info = document.createElement('div');
                    info.className = 'sr-info';
                    const name = document.createElement('div');
                    name.className = 'sr-name';
                    const en = item.node.en_name || '';
                    const enIdx = en.toLowerCase().indexOf(q);
                    if (enIdx >= 0) {
                        name.textContent = '';
                        name.appendChild(document.createTextNode(en.slice(0, enIdx)));
                        const h = document.createElement('span');
                        h.className = 'hl';
                        h.textContent = en.slice(enIdx, enIdx + query.length);
                        name.appendChild(h);
                        name.appendChild(document.createTextNode(en.slice(enIdx + query.length)));
                    } else {
                        name.textContent = en;
                    }
                    info.appendChild(name);
                    const path = document.createElement('div');
                    path.className = 'sr-path';
                    path.textContent = (item.node.cn_name || '') + '  ·  ' +
                        buildPathText(item.node, 'en_name').join('  ›  ');
                    info.appendChild(path);
                    div.appendChild(info);
                    const btn = document.createElement('span');
                    btn.className = 'sr-select';
                    btn.textContent = '选择';
                    div.appendChild(btn);
                    div.addEventListener('click', function () {
                        cascadeSearch.value = '';
                        cascadeSearchClear.classList.remove('show');
                        searchResults.style.display = 'none';
                        searchResults.innerHTML = '';
                        restoreCatalogView();
                        cascadeEmpty.classList.remove('show');
                        // 扁平列表已全量渲染，直接选中并滚动定位
                        selectLeafNode(item.node);
                    });
                    searchResults.appendChild(div);
                });
            }

            // ===== 电商分类视图（参照参考网站 gb.marinsmart.pro「分类大厅」：扁平分组列表，全量平铺，无悬浮 panel） =====
            function rootOf(node) {
                for (const r of TREE) {
                    let found = false;
                    (function contain(n) {
                        if (n === node) { found = true; return; }
                        if (n.children) n.children.forEach(contain);
                    })(r);
                    if (found) return r;
                }
                return TREE[0];
            }

            function flattenLeaves(node) {
                if (!node.children || !node.children.length) return [node];
                let result = [];
                node.children.forEach(function (c) { result = result.concat(flattenLeaves(c)); });
                return result;
            }

            // 扁平分组列表：一级分类 = 分组标题；二级分类 = 小节标题；三级分类 = 可点击入口（点击进入商品展示）
            function renderMall() {
                mallGroups.innerHTML = '';
                TREE.forEach(function (root) {
                    const group = document.createElement('div');
                    group.className = 'mg-group';
                    const head = document.createElement('div');
                    head.className = 'mg-head';
                    head.dataset.code = root.code;
                    const hen = document.createElement('span');
                    hen.className = 'mg-en';
                    hen.textContent = root.en_name || root.cn_name;
                    head.appendChild(hen);
                    const hcn = document.createElement('span');
                    hcn.className = 'mg-cn';
                    hcn.textContent = root.cn_name || '';
                    head.appendChild(hcn);
                    group.appendChild(head);

                    (root.children || []).forEach(function (sec) {
                        const secEl = document.createElement('div');
                        secEl.className = 'mg-sec';
                        const st = document.createElement('div');
                        st.className = 'mg-sec-title';
                        st.dataset.code = sec.code;
                        const sen = document.createElement('span');
                        sen.className = 'ms-en';
                        sen.textContent = sec.en_name || sec.cn_name;
                        st.appendChild(sen);
                        const scn = document.createElement('span');
                        scn.className = 'ms-cn';
                        scn.textContent = sec.cn_name || '';
                        st.appendChild(scn);
                        secEl.appendChild(st);

                        const body = document.createElement('div');
                        body.className = 'mg-sec-body';
                        const chips = document.createElement('div');
                        chips.className = 'mg-sec-chips';
                        (sec.children || []).forEach(function (c) {
                            const subt = document.createElement('button');
                            subt.type = 'button';
                            subt.className = 'tv-link';
                            subt.dataset.code = c.code;
                            const suben = document.createElement('span');
                            suben.className = 'tv-group-en';
                            suben.textContent = c.en_name || c.cn_name;
                            subt.appendChild(suben);
                            const subcn = document.createElement('span');
                            subcn.className = 'tv-group-cn';
                            subcn.textContent = c.cn_name || '';
                            subt.appendChild(subcn);
                            // 同左树：点击三级分类统一进入设备页面（商品展示）选择
                            subt.addEventListener('click', function () { openProductView(sec, c); });
                            chips.appendChild(subt);
                        });
                        body.appendChild(chips);
                        secEl.appendChild(body);
                        group.appendChild(secEl);
                    });
                    mallGroups.appendChild(group);
                });
            }

            cascadeSearch.addEventListener('input', function () { applyCascadeSearch(this.value); });
            cascadeSearchClear.addEventListener('click', function () {
                cascadeSearch.value = '';
                applyCascadeSearch('');
                cascadeSearch.focus();
            });

            // ============================================================
            // 初始化
            // ============================================================
            renderMall();
            updateAddLinkVisibility();
            refreshDeviceDependentDropdowns();
            rebuildDemoPackages();   // 套餐改由后台 PACKAGES 重建（核心：以后台数据为准）
            updateItemCount();
            svcRenderOptions();      // 服务信息（D17）：三级下拉 + 紧急下拉 + 日期下限
            svcBindEvents();
            svcHintUpdate();
            if (window.DP) DP(svcDateInp);   // 服务时间：antd 风格 DatePicker（替换原生 date 控件）
            if (window.SEL) [svcUrgSel, svcRegionSel, svcCountrySel, svcSiteSel].forEach(function (el) {
                if (el) SEL.mount(el, { allowClear: false });  // 服务信息下拉：antd 风格 Select（前台客户侧不显示清除按钮）
            });
            setupSearchSelect(maintType, maintTypeInput, maintTypePanel, document.getElementById('maintTypeClear'));
            setupSearchSelect(manufacturer, manufacturerInput, manufacturerPanel, document.getElementById('manufacturerClear'), function () {
                rebuildManufacturerByModel(true);
            });
            setupSearchSelect(model, modelInput, modelPanel, document.getElementById('modelClear'));
            setupSearchSelect(maintCycleHours, maintCycleInput, maintCyclePanel, document.getElementById('maintCycleClear'));

            // ===== 联动后台管理数据（核心：以后台数据为准） =====
            // 加载后台 IndexedDB 持久化状态（后台管理页的编辑结果），重建 demo 全部派生数据
            function refreshFromBackend() {
                try {
                    loadEquipmentData(EQUIPMENT_NAME);
                    rebuildDemoPackages();
                    rebuildModelOptions();
                    rebuildManufacturerByModel(true);
                    svcRenderOptions();   // 紧急/地点/系数与保底参数以后台为准（保留已选值，失效则回默认）
                    svcHintUpdate();
                    if (selectedLeaf) renderItemsArea();
                    updateItemCount();
                } catch (e) { /* 出错则沿用当前（种子）数据，不影响页面 */ }
            }
            if (typeof initState === 'function') {
                initState().then(refreshFromBackend).catch(function () { refreshFromBackend(); });
            }
            // 多标签页联动：后台管理页保存后通过 BroadcastChannel 通知，本页自动同步最新数据
            window.pcOnRemoteUpdate = function () {
                if (typeof loadState !== 'function') { refreshFromBackend(); return; }
                loadState().then(function (loaded) {
                    try { if (loaded && loaded.state) restoreState(loaded.state, loaded.audit); } catch (e) {}
                    refreshFromBackend();
                    showToast('已同步后台管理数据的最新变更', 'info', 2500);
                }).catch(function () { refreshFromBackend(); });
            };

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && !isSubmitLocked() && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
                    step2Push.click();
                }
            });

        })();
    </script>

</body>
