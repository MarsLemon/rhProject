                selectedPackage = selCount > 0 ? pkg.id : '';
            }

            // 校验展示“维保方案”所需的前置条件是否已填齐
            function hasPackagePrereqs() {
                const hasModel = !!model.value || !!customModel;
                const cycleInput = document.getElementById('maintCycleHours');
                const hasCycle = !maintCycleEnabled() || !!(cycleInput && cycleInput.value && String(cycleInput.value).trim() !== '');
                const hasCyl = !!(cylInput.value && String(cylInput.value).trim() !== '');
                const hasManufacturer = !!manufacturer.value || !!customManufacturer;
                const hasMaintType = !!maintType.value;
                return !!deviceType.value && hasModel && hasCyl && hasManufacturer && hasMaintType && hasCycle;
            }

            function renderItems() {
                if (!hasPackagePrereqs()) {
                    itemsArea.style.display = 'none';
                    updateItemCount();
                    return;
                }
                itemsArea.style.display = 'block';
                if (!selectedPackage && SPECIAL_5Y_LEAVES.length > 0) {
                    // 仅当当前型号 / 维保类型 / 周期确实命中标准套餐时才自动选；
                    // 未命中（R-26）不自动选套餐，保持只展示可选项（与 PC 对齐）
                    const matchedPkg = resolvePkgRule();
                    if (matchedPkg) {
                        selectPackage(matchedPkg);
                        return;
                    }
                }
                renderPackageUI();
                applyItemFilter();
                updateItemCount();
                liveRenderBudget();
            }

            // ===== 预算生成（用于计算） =====
            // 维保类型名称 → 后台 mt code（与 PC maintTypeCode 对齐）
            function maintTypeCode() {
                const name = (maintType && maintType.value) || '';
                if (!name) return '';
                if (typeof MTYPES !== 'undefined') {
                    const m = MTYPES.find(function (x) { return x.name === name; });
                    if (m) return m.code;
                }
                if (name === '液压和电控系统保养') return 'HYDELEC';
                return '';
            }
            // R-28：周期仅在类型启用周期时生效；未启用的类型不得带周期（IN-MC-09）
            function maintCycleEnabled() {
                if (typeof MTYPES === 'undefined') return (maintType && maintType.value === '液压和电控系统保养');
                const t = MTYPES.find(function (x) { return x.name === ((maintType && maintType.value) || ''); });
                return !!(t && t.cycle);
            }
            function currentCycle() {
                if (!maintCycleEnabled()) return '';
                const cycEl = document.getElementById('maintCycleHours');
                return (cycEl && cycEl.value) || '';
            }
            function syncCycleDefault() {
                const cycEl = document.getElementById('maintCycleHours');
                if (cycEl && maintCycleEnabled() && !cycEl.value) {
                    cycEl.value = ((typeof CYCLES !== 'undefined' && CYCLES[0]) || '5年保养');
                    if (cycEl._syncInput) cycEl._syncInput();
                }
            }
            // R-05 修订：缸数不再由型号自动带出，由客户手动填写（1–20 整数）
            // 单项单价：与 PC 完全一致 —— 后台标准工时三级回溯 → 人员配置费率 × 工时
            // （设备级标准工时由 buildDomainModel 从 SI_LEGACY_PRICE 折算而来，源头同一份数据）
            function h5ItemUnitPrice(it) {
                if (!it || !it.siCode) return (it && it.unit_price_usd) ? it.unit_price_usd : 0;
                const modelName = (model && model.value) || customModel || '';
                const mt = maintTypeCode();
                // 工时按"发动机实际气缸数"计：优先取客户确认的缸数，未填时取型号缸数
                const modelEntry = MODELS.find(function (m) { return m.name === modelName; });
                const cylInputVal = parseInt((cylInput && cylInput.value), 10);
                const cylN = (!isNaN(cylInputVal) && cylInputVal >= 1)
                    ? cylInputVal : (parseInt(modelEntry && modelEntry.cyl, 10) || 6);
                const cycle = currentCycle();
                const r = resolveLaborStandard(it.siCode, modelName, mt, cycle);
                if (!r) return 0;
                const H = laborHoursOf(r.std, cylN);
                if (!H) return 0;
                return rateSumOf(r.std.crew, RATES.active.rates) * H;
            }

            function generateBudget(planItems) {
                const items = planItems.map(key => {
                    const it = ITEM_MAP[key];
                    if (!it) return null;
                    let defaultQty = it.base_qty;
                    if (defaultQty === '缸数') {
                        const cyl = parseInt((cylInput && cylInput.value) || '0', 10);
                        defaultQty = (isNaN(cyl) || cyl < 1) ? 1 : cyl;
                    } else {
                        defaultQty = (isNaN(parseInt(defaultQty, 10)) || parseInt(defaultQty, 10) < 1) ? 1 :
                            parseInt(defaultQty, 10);
                    }
                    const unitPrice = h5ItemUnitPrice(it);
                    return {
                        name: key,
                        item_name: it.item_name,
                        unit: it.unit || '',
                        defaultQty: defaultQty,
                        unitPrice: unitPrice,
                        total: unitPrice * defaultQty,   // v1.14 去件数系数（D18）：多件不再折减
                        cat: it.cat
                    };
                }).filter(Boolean);
                const subtotal = items.reduce((s, i) => s + i.total, 0);
                return { items, subtotal, total: subtotal };
            }

            // ===== 判断是否属于标准套餐 =====
            // 标准套餐判定：严格按当前选中套餐的 siCodes 命中（与 PC PKG_KEY_SET 同源）
            function isStandardItem(key) {
                const it = ITEM_MAP[key];
                if (!it || !it.siCode) return false;
                // 无选中套餐（如 R-26 未命中）时，没有任何项属于「标准套餐」，全部归为可选项目
                if (!selectedPackage) return false;
                const pkg = PKG_LIST.find(function (p) { return p.id === selectedPackage; });
                return pkg && (pkg.siCodes || []).indexOf(it.siCode) !== -1;
            }

            // ===== 保底价（D16/R-30，按一份计）：人员配置综合费率 × 最低计费工时 =====
            function h5ItemFloor(it) {
                if (!it || !it.siCode) return 0;
                const mtCode = maintTypeCode();
                const cycle = currentCycle();
                const modelName = (model && model.value) || customModel || '';
                const r = (typeof resolveLaborStandard === 'function') ? resolveLaborStandard(it.siCode, modelName, mtCode, cycle) : null;
                if (!r) return 0;
                const rates = (typeof RATES !== 'undefined' && RATES.active) ? RATES.active.rates : null;
                return rateSumOf(r.std.crew, rates) * ((typeof PPARAMS !== 'undefined' && PPARAMS) ? PPARAMS.minH : 8);
            }
            // 合计保底价 = Σ(各已勾选且可计价服务项的项保底价)；未勾选可选项不计入（R-30）
            function h5FloorTotals() {
                const minH = (typeof PPARAMS !== 'undefined' && PPARAMS) ? PPARAMS.minH : 8;
                const floorOn = (typeof PPARAMS !== 'undefined' && PPARAMS) ? !!PPARAMS.floorOn : true;
                if (!floorOn) return { floorOn: false, floorTotal: 0, floorN: 0, floorHours: minH };
                let f = 0, n = 0;
                selectedItems.forEach(function (key) {
                    const it = ITEM_MAP[key];
                    if (!it) return;
                    if (!isStandardItem(key) && quoteExcluded.has(key)) return;
                    const v = h5ItemFloor(it);
                    if (v > 0) { f += v; n++; }
                });
                return { floorOn: true, floorTotal: f, floorN: n, floorHours: minH };
            }

            // ===== 渲染预算（精简版） =====
            // 合计区（D16/D17）：客户侧仅展示最终报价（R-36 口径扩展）——
            // 明细合计/保底价/影响系数不外显，构成冻结进快照，后台「客户定价单」与销售邮件可见。
            // renderBudget 与 STEP 2 的 recalcAll 共用，保证勾选/数量/服务信息变化后口径一致
            function h5TotalsBoxHtml(detailTotal) {
                const ft = h5FloorTotals();
                const co = svcCoef();
                const pricingBase = Math.max(ft.floorTotal, detailTotal);
                const grandTotal = Math.round(pricingBase * co.k * 100) / 100;
                return '<div style="margin-top:16px;padding:14px 16px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center;gap:12px;">'
                    + '<span style="font-weight:600;font-size:16px;color:var(--gray-800);">预算合计</span>'
                    + '<span style="font-size:20px;font-weight:700;color:var(--primary);">$' + fmtNum(Math.round(grandTotal)) + '</span></div>';
            }
            function renderBudget() {
                const deviceLabel = selectedDeviceName || deviceType.value || '设备';
                const itemsToUse = selectedItems;
                quoteExcluded = new Set([...quoteExcluded].filter(n => itemsToUse.includes(n)));

                // 分离标准套餐和可选项目
                const standardKeys = [];
                const optionalKeys = [];
                itemsToUse.forEach(function (key) {
                    const it = ITEM_MAP[key];
                    if (!it) return;
                    if (isStandardItem(key)) {
                        standardKeys.push(key);
                    } else {
                        optionalKeys.push(key);
                    }
                });

                const cylVal = parseInt((cylInput && cylInput.value) || '0', 10);
                const cylText = cylVal > 0 ? cylVal + '缸' : '';
                const manuText = getManufacturerText();
                const modelText = getModelText();
                const maintText = (maintType.selectedOptions[0] && maintType.value) ? maintType.selectedOptions[0].text :
                    '';
                const subInfo = [[manuText, modelText].filter(Boolean).join(' · '), cylText, maintText].filter(Boolean)
                    .join(' · ');
                const shipNameVal = (shipName.value || '').trim();

                // ---- 顶部：设备信息（去掉计数和价格） ----
                let html = `
                    <div style="background:var(--gray-50);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;border:1px solid var(--gray-200);">
                        <div style="font-weight:600;font-size:15px;display:flex;flex-wrap:wrap;gap:6px;">
                            <span>${escapeHtml(deviceLabel)}${shipNameVal ? '（' + escapeHtml(shipNameVal) + '）' : ''}</span>
                        </div>
                        ${subInfo ? '<div style="font-size:12px;color:var(--gray-500);margin-top:4px;">' + escapeHtml(subInfo) + '</div>' : ''}
                    </div>
                `;

                // 计算标准套餐单价（按子项实际数量，即 quoteQty）
                let stdUnitPrice = 0;
                if (standardKeys.length > 0) {
                    const stdBudget = generateBudget(standardKeys);
                    stdUnitPrice = stdBudget.items.reduce(function (s, item) {
                        const qty = quoteQty[item.name] != null ? quoteQty[item.name] : item.defaultQty;
                        return s + (item.unitPrice || 0) * qty;   // v1.14 去件数系数（D18）
                    }, 0);
                }

                // 套餐不再有份数（2026-09-10 评审）：套餐小计 = Σ(勾选明细行金额)
                const stdTotal = stdUnitPrice;

                // ---- 标准套餐卡片（无标准项时不渲染）----
                if (standardKeys.length > 0) {
                    html += '<div class="budget-pkg-card">';
                    html += '<div class="pkg-head">';
                    html += '<span class="pkg-title">标准保养套餐 <span class="pkg-badge">推荐项目</span></span>';
                    html += '</div>';
                    html += '</div>';
                }

                // ---- 可选项目卡片 ----
                if (optionalKeys.length > 0) {
                    const optBudget = generateBudget(optionalKeys);
                    // 初始化数量
                    optBudget.items.forEach(function (item) {
                        if (quoteQty[item.name] == null) {
                            quoteQty[item.name] = item.defaultQty;
                        }
                    });

                    html += '<div class="budget-pkg-card budget-optional-section" style="border-color:var(--gray-300);">';
                    html += '<div class="pkg-head">';
                    html += '<span class="pkg-title">可选项目 <span class="pkg-badge">可选项目</span></span>';
                    html += '</div>';
                    html += '<div class="pkg-items">';
                    optBudget.items.forEach(function (item) {
                        const checked = !quoteExcluded.has(item.name);
                        const qty = quoteQty[item.name] || item.defaultQty;
                        html += '<div class="opt-item-row">';
                        html += '<span class="opt-item-check"><input type="checkbox" class="opt-check" data-item="' +
                            escapeHtml(item.name) + '" ' + (checked ? 'checked' : '') + '></span>';
                        html += '<span class="opt-item-name">' + escapeHtml(item.item_name) + '</span>';
                        html += '<span class="opt-item-qty">';
                        html += '<button type="button" class="opt-qty-dec" data-item="' + escapeHtml(item
                            .name) + '" aria-label="减少">−</button>';
                        html += '<input type="number" class="opt-qty-input" data-item="' + escapeHtml(item
                            .name) + '" min="1" step="1" value="' + qty + '" aria-label="数量">';
                        html += '<button type="button" class="opt-qty-inc" data-item="' + escapeHtml(item
                            .name) + '" aria-label="增加">＋</button>';
                        html += '</span>';
                        html += '<span class="opt-item-unit">' + escapeHtml(item.unit) + '</span>';
                        html += '</div>';
                    });
                    html += '</div>';
                    html += '</div>';
                }

                // ---- 底部合计（D16/D17：明细合计 → 保底托底 → ×影响系数 → 最终报价）----
                if (standardKeys.length > 0 || optionalKeys.length > 0) {
                    let detailTotal = stdTotal;
                    // 可选项目小计（未排除）
                    let optTotal = 0;
                    if (optionalKeys.length > 0) {
                        const optBudget = generateBudget(optionalKeys);
                        optBudget.items.forEach(function (item) {
                            if (!quoteExcluded.has(item.name)) {
                                const qty = quoteQty[item.name] || item.defaultQty;
                                optTotal += item.unitPrice * qty;   // v1.14 去件数系数（D18）
                            }
                        });
                    }
                    detailTotal += optTotal;
                    html += '<div id="budgetTotalBox">' + h5TotalsBoxHtml(detailTotal) + '</div>';
                }

                if (standardKeys.length === 0 && optionalKeys.length === 0) {
                    html += '<div class="budget-empty-hint">暂无选中的维保项目</div>';
                }

                budgetDisplay.innerHTML = html;
                priceJudgeBar.style.display = 'block';
                priceFeedbackInput.value = '';

                // ---- 事件绑定 ----
                // 可选数量
                budgetDisplay.querySelectorAll('.opt-qty-input').forEach(function (inp) {
                    inp.addEventListener('input', function () {
                        let v = parseInt(this.value, 10);
                        if (isNaN(v) || v < 1) v = 1;
                        this.value = v;
                        quoteQty[this.dataset.item] = v;
                        recalcAll();
                    });
                });
                budgetDisplay.querySelectorAll('.opt-qty-dec, .opt-qty-inc').forEach(function (btn) {
                    btn.addEventListener('click', function (e) {
                        e.preventDefault();
                        const itemName = this.dataset.item;
                        const inp = Array.prototype.find.call(
                            budgetDisplay.querySelectorAll('.opt-qty-input'),
                            function (el) { return el.dataset.item === itemName; }
                        );
                        if (!inp) return;
                        let v = parseInt(inp.value, 10);
                        if (isNaN(v) || v < 1) v = 1;
                        v += this.classList.contains('opt-qty-inc') ? 1 : -1;
                        if (v < 1) v = 1;
                        inp.value = v;
                        quoteQty[itemName] = v;
                        recalcAll();
                    });
                });

                // 可选勾选
                budgetDisplay.querySelectorAll('.opt-check').forEach(function (cb) {
                    cb.addEventListener('change', function () {
                        const itemName = this.dataset.item;
                        if (this.checked) quoteExcluded.delete(itemName);
                        else quoteExcluded.add(itemName);
                        recalcAll();
                    });
                });

                // ---- 重新计算汇总 ----
                function recalcAll() {
                    // 标准套餐小计 = Σ(勾选明细行金额)，无份数
                    const stdTotalVal = stdUnitPrice;

                    // 可选项目
                    let optTotalVal = 0;
                    budgetDisplay.querySelectorAll('.opt-check').forEach(function (cb) {
                        if (cb.checked) {
                            const itemName = cb.dataset.item;
                            const inp = Array.prototype.find.call(
                                budgetDisplay.querySelectorAll('.opt-qty-input'),
                                function (el) { return el.dataset.item === itemName; }
                            );
                            if (inp) {
                                const qty = parseInt(inp.value, 10) || 1;
                                const it = ITEM_MAP[itemName];
                                if (it) {
                                    optTotalVal += (it.unit_price_usd || 0) * qty;
                                }
                            }
                        }
                    });

                    // 最终报价（D16/D17）：Max(合计保底价, 明细合计) × 影响系数
                    const detailTotalVal = stdTotalVal + optTotalVal;
                    const box = document.getElementById('budgetTotalBox');
                    if (box) box.innerHTML = h5TotalsBoxHtml(detailTotalVal);
                    box && box.setAttribute('aria-live', 'polite');
                }

                // 初始化计算
                setTimeout(recalcAll, 50);
            }

            function renderBudgetPlaceholder() {
                budgetDisplay.innerHTML = '<div class="budget-empty-hint">请先在上方选择维保项目，<br>报价明细将显示在这里。</div>';
                priceJudgeBar.style.display = 'none';
            }

            function liveRenderBudget() {
                if (currentStep !== 2) return;
                if (selectedItems.length > 0) {
                    renderBudget();
                } else {
                    renderBudgetPlaceholder();
                }
            }

            // ===== 步骤切换 =====
            function setStep(step) {
                currentStep = step;
                panels.forEach(p => p.classList.toggle('active', parseInt(p.dataset.step) === step));
                dots.forEach(d => {
                    const s = parseInt(d.dataset.step);
                    d.classList.remove('active', 'done');
                    if (s === step) d.classList.add('active');
                    else if (s < step) d.classList.add('done');
                });
                document.querySelector('.app-container').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                if (step === 0) {
                    cascadeSearch.value = '';
                    cascadeSearchClear.classList.remove('show');
                    cascadeEmpty.classList.remove('show');
                    searchResults.style.display = 'none';
                    searchResults.innerHTML = '';
                    cascadeTree.style.display = '';
                }
            }

            // ===== 事件绑定 =====
            deviceType.addEventListener('change', function () {
                selectedItems = [];
                selectedPackage = '';
                expandedPkg = '';
                quoteExcluded.clear();
                quoteQty = {};
                applyBackendPackages();
                rebuildSugSet();
                loadEquipmentData(deviceType.value);
                refreshMaintTypeOptions();
                refreshDeviceDependentDropdowns();
                renderItems();
                updateItemCount();
                updateAddLinkVisibility();
                liveRenderBudget();
            });

            maintType.addEventListener('change', function () {
                syncCycleDefault();
                const cycleGroup = document.getElementById('cycleFieldGroup');
                if (cycleGroup) {
                    cycleGroup.style.display = maintCycleEnabled() ? '' : 'none';
                }
                rebuildSugSet();   // 维保类型变化 → 建议项集合随之刷新（与 PC 一致）
                renderItems();
                updateAddLinkVisibility();
                updateItemCount();
                liveRenderBudget();
            });

            const maintCycleHours = document.getElementById('maintCycleHours');
            if (maintCycleHours) {
                maintCycleHours.addEventListener('change', function () {
                    rebuildSugSet();   // 保养周期变化 → 建议项集合随之刷新（与 PC 一致）
                    renderItems();
                    updateItemCount();
                });
            }

            manufacturer.addEventListener('change', function () {
                renderItems();
                updateItemCount();
            });

            // 依据当前已选型号重建制造厂家下拉选项（preserve=true 时保留已选厂家）
            function rebuildManufacturerByModel(preserve) {
                const modelVal = model.value || customModel;
                let manus = getManufacturersForModel(modelVal);
                if (!manus.length) manus = ALL_MANUFACTURERS.slice(); // 自定义/未知型号兜底
                const prev = manufacturer.value;
                manufacturer.innerHTML = '<option value="">请选择制造厂家</option>';
                manus.forEach(function (m) {
                    const o = document.createElement('option');
                    o.value = m;
                    o.textContent = m;
                    manufacturer.appendChild(o);
                });
                if (preserve && prev && manus.indexOf(prev) !== -1) {
                    manufacturer.value = prev;
                } else {
                    manufacturer.value = manus.length ? manus[0] : '';
                }
                if (manufacturer._syncInput) manufacturer._syncInput();
            }

            model.addEventListener('change', function () {
                rebuildManufacturerByModel(false);
                selectedItems = [];
                selectedPackage = '';
                expandedPkg = '';
                quoteExcluded.clear();
                quoteQty = {};
                rebuildSugSet();   // 型号变化 → 建议项集合(按型号 dev)随之刷新（与 PC 一致）
                renderItems();
                updateItemCount();
                updateAddLinkVisibility();
            });

            // 新增厂家/型号
            function openCustomAdd() {
                customManuInput.value = customManufacturer;
                customModelInput.value = customModel;
                customNeedInput.value = customNeed;
                customAddModal.classList.add('open');
                setTimeout(() => customManuInput.focus(), 50);
            }

            function closeCustomAdd() {
                customAddModal.classList.remove('open');
            }

            function confirmCustomAdd() {
                const manuVal = customManuInput.value.trim();
                const modelVal = customModelInput.value.trim();
                const needVal = customNeedInput.value.trim();
                if (!manuVal && !modelVal) { customManuInput.focus(); return; }
                customManufacturer = manuVal;
                customModel = modelVal;
                customNeed = needVal;
                closeCustomAdd();
                renderItems();
                updateItemCount();
                updateAddLinkVisibility();
                showToast('需求已提交，我们会尽快与您联系。', 'success');
            }

            addCustomLink.addEventListener('click', openCustomAdd);
            customAddConfirm.addEventListener('click', confirmCustomAdd);
            customAddCancel.addEventListener('click', closeCustomAdd);
            customAddClose.addEventListener('click', closeCustomAdd);
            customAddModal.addEventListener('click', function (e) {
                if (e.target === customAddModal) closeCustomAdd();
            });
            customModelInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') confirmCustomAdd();
            });

            // Toast
            let toastTimer = null;

            function showToast(message, type, duration) {
                type = type || 'info';
                duration = duration || 3000;
                toastText.textContent = message;
                toast.classList.remove('info', 'success');
                toast.classList.add(type);
                toast.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(function () {
                    toast.classList.remove('show');
                }, duration);
            }

            // Step 1: Next
            step1Next.addEventListener('click', function () {
                if (step1Next.disabled) {
                    if (selectedItems.length === 0) {
                        const pkgContainer = document.getElementById('packageContainer');
                        if (pkgContainer) {
                            const oldTip = pkgContainer.querySelector('.no-item-tip');
                            if (oldTip) oldTip.remove();
                            const tip = document.createElement('div');
                            tip.className = 'no-item-tip';
                            tip.textContent = '请至少选择一项维保项目';
                            pkgContainer.appendChild(tip);
                            setTimeout(function () { if (tip.parentNode) tip.remove(); }, 3000);
                        }
                    }
                    return;
                }
                setStep(2);
                renderBudget();
            });

            step1Back.addEventListener('click', function () {
                setStep(0);
            });

            document.getElementById('step3Back').addEventListener('click', function () {
                quoteExcluded.clear();
                setStep(1);
            });

            // ===== 提交冻结（R-23）：组装询价单快照，写入共享存储供后台「客户定价单」展示 =====
            function freezeInquiryRecord() {
                const modelName = (model && model.value) || customModel || '';
                const mtCode = maintTypeCode();
                const cycle = currentCycle();
                const cylVal = parseInt((cylInput && cylInput.value) || '0', 10);
                const modelEntry = (typeof MODELS !== 'undefined') ? MODELS.find(function (m) { return m.name === modelName; }) : null;
                const cylN = (!isNaN(cylVal) && cylVal >= 1) ? cylVal : (parseInt(modelEntry && modelEntry.cyl, 10) || 6);
                function laborOf(it) {
                    try {
                        if (!it.siCode || typeof resolveLaborStandard !== 'function') return null;
                        const r = resolveLaborStandard(it.siCode, modelName, mtCode, cycle);
                        if (!r || !r.std) return null;
                        const H = laborHoursOf(r.std, cylN);
                        if (!H) return null;
                        const rates = (typeof RATES !== 'undefined' && RATES.active) ? RATES.active.rates : null;
                        const crew = r.std.crew || {};
                        const crewTxt = Object.keys(crew).map(function (k) { return k + '×' + crew[k]; }).join('+');
                        return { level: r.level, crew: crewTxt, rateSum: rateSumOf(crew, rates), hours: H };
                    } catch (e) { return null; }
                }
                function lineOf(key, type) {
                    const it = ITEM_MAP[key];
                    if (!it) return null;
                    const budget = generateBudget([key]);
                    const b = budget.items[0];
                    if (!b) return null;
                    const qty = quoteQty[b.name] != null ? quoteQty[b.name] : b.defaultQty;
                    return {
                        type: type,
                        name: it.item_name, unit: it.unit || '',
                        unitPrice: Math.round(b.unitPrice || 0),
                        qty: qty,
                        amount: Math.round((b.unitPrice || 0) * qty),   // v1.14 去件数系数（D18）
                        labor: laborOf(it)
                    };
                }
                const lines = [];
                let stdUnitPrice = 0;
                let stdCount = 0;
                selectedItems.forEach(function (key) {
                    if (!ITEM_MAP[key]) return;
                    if (isStandardItem(key)) {
                        const l = lineOf(key, 'package');
                        if (l) { lines.push(l); stdUnitPrice += l.amount; stdCount++; }
                    } else if (!quoteExcluded.has(key)) {   // 未勾选的可选项不进快照
                        lines.push(lineOf(key, 'optional'));
                    }
                });
                let optTotal = 0;
                lines.forEach(function (l) { if (l.type === 'optional') optTotal += l.amount; });
                const stdTotal = stdUnitPrice;
                const detailTotal = stdTotal + optTotal;
                // 新价格构成随快照冻结（R-23 / IN-INQ-06）：保底三要素 + 三维系数 + 最终报价
                const ft = h5FloorTotals();
                const co = svcCoef();
                const s = svcEnsure();
                const floorShortfall = Math.max(0, ft.floorTotal - detailTotal);
                const pricingBase = Math.max(ft.floorTotal, detailTotal);
                const pkg = selectedPackage
                    ? (PKG_LIST.find(function (p) { return p.id === selectedPackage; }) || {})
                    : {};
                return {
                    no: '', at: 0, atTxt: '', src: 'H5',
                    customer: null,   // demo 无登录态；正式系统取登录快照（表设计 inquiry）
                    shipName: (shipName.value || '').trim(),
                    deviceName: selectedDeviceName || deviceType.value || '',
                    deviceCode: (typeof EQUIPMENT_NAME !== 'undefined' && typeof EQUIP_DEV !== 'undefined' && EQUIP_DEV[EQUIPMENT_NAME]) || '',
                    modelName: getModelText(), modelCustom: !!customModel,
                    cyl: cylN,
                    manufacturer: getManufacturerText(), manufacturerCustom: !!customManufacturer,
                    maintTypeCode: mtCode || '',
                    maintTypeName: (maintType.selectedOptions[0] && maintType.value) ? maintType.selectedOptions[0].text : '',
                    cycle: cycle || null,
                    currency: 'USD', remarks: (priceFeedbackInput.value || '').trim(),
                    stdPkg: stdCount ? { name: pkg.name || '标准保养', subtotal: Math.round(stdTotal) } : null,
                    lines: lines,
                    svc: {
                        urgKey: s.urg, urgency: co.u.label, urgC: co.u.c,
                        region: s.region, country: s.country, site: s.site,
                        locC: co.l.c, locLevel: co.l.level, locTxt: svcLocTxt(),
                        serviceDate: s.date, leadDays: co.days == null ? 0 : co.days, leadC: co.b.c,
                        leadNote: co.b && co.b.band ? (co.b.band.note || '') : ''
                    },
                    detailTotal: Math.round(detailTotal),
                    floorHours: ft.floorHours, floorTotal: Math.round(ft.floorTotal), floorN: ft.floorN,
                    floorShortfall: Math.round(floorShortfall), pricingBase: Math.round(pricingBase),
                    coefficient: co.k,
                    grand: Math.round(pricingBase * co.k)
                };
            }

            step2Push.addEventListener('click', function () {
                let rec = null;
                try { rec = freezeInquiryRecord(); } catch (e) { rec = null; }   // 冻结失败不阻断提交主流程
                if (rec) {
                    INQStore.list().then(function (list) {
                        rec.no = INQStore.nextNo(list);
                        const st = INQStore.stamp();
                        rec.at = st.at; rec.atTxt = st.atTxt;
                        return INQStore.save(rec);
                    }).then(function (saved) {
                        showToast('提交成功！询价单号 ' + saved.no + '，我们会尽快回复您。', 'success', 4000);
                    }).catch(function () {
                        showToast('提交成功！我们会尽快回复您。', 'success', 4000);
                    });
                } else {
                    showToast('提交成功！我们会尽快回复您。', 'success', 4000);
                }
                resetAll();
            });

            // Reset
            function resetAll() {
                selectedItems = [];
                quoteExcluded.clear();
                quoteQty = {};
                priceFeedbackInput.value = '';
                shipName.value = '';
                deviceType.value = '';
                selectedDeviceName = '';
                if (deviceType._syncInput) deviceType._syncInput();
                loadEquipmentData('Main diesel engine');
                refreshMaintTypeOptions();
                cylInput.value = '';
                resetCustomFields();
                refreshDeviceDependentDropdowns();
                updateAddLinkVisibility();
                selectedPackage = '';
                expandedPkg = '';
                const pkgC = document.getElementById('packageContainer');
                if (pkgC) pkgC.innerHTML = '';
                svcInfo = null;            // 服务信息回默认（不紧急 / 第一个地区+国家；日期清空）
                svcRenderOptions();
                svcHintUpdate();
                updateItemCount();
                priceJudgeBar.style.display = 'none';
                step2Buttons.style.display = 'flex';
                step1Next.disabled = true;
                clearSelection();
                setStep(0);
                renderBudgetPlaceholder();
            }

            // ===== 引导树 =====
            const TREE = [{
                level: 1,
                code: "6",
                cn_name: "机械设备主要部件",
                en_name: "MACHINERY MAIN COMPONENTS",
                children: [{
                    level: 2,
                    code: "60",
                    cn_name: "推进用柴油机",
                    en_name: "DIESEL ENGINES FOR PROPULSION",
                    children: [{
                        level: 3,
                        code: "601",
                        cn_name: "柴油机",
                        en_name: "DIESEL ENGINES",
                        children: [{
                            level: 4,
                            code: "601.001",
                            cn_name: "主机柴油机",
                            en_name: "Main diesel engine",
                            equipment_name: "Main diesel engine",
                            all_maintenance_types: ["5年保养", "10年保养", "健康检查", "监工服务",
                                "车间保养测试", "常规吊缸类", "故障排查维修", "部件翻新"
                            ],
                            equipment_series: (EQUIPMENT_DATA['Main diesel engine'] || {})
                                .equipment_series || []
                        }]
                    }]
                }, {
                    level: 2,
                    code: "65",
                    cn_name: "发电用电动机装置",
                    en_name: "MOTOR AGGREGATES FOR MAIN ELECTRIC POWER PRODUCTION",
                    children: [{
                        level: 3,
                        code: "651",
                        cn_name: "电动机装置",
                        en_name: "MOTOR AGGREGATES",
                        children: [{
                            level: 4,
                            code: "651.001",
                            cn_name: "辅助柴油发电机组",
                            en_name: "Aux. diesel generator aggregates, complete",
                            equipment_name: "Aux. diesel generator aggregates, complete",
                            all_maintenance_types: ["5年保养", "10年保养", "健康检查", "监工服务",
                                "车间保养测试", "常规吊缸类", "故障排查维修", "部件翻新"
                            ],
                            equipment_series: []
                        }]
                    }]
                }]
            }];

            const cascadeTree = document.getElementById('cascadeTree');
            const cascadeConfirm = document.getElementById('cascadeConfirm');
            const cascadeSearch = document.getElementById('cascadeSearch');
            const cascadeSearchClear = document.getElementById('cascadeSearchClear');
            const cascadeEmpty = document.getElementById('cascadeEmpty');
            const searchResults = document.getElementById('searchResults');
            let selectedLeaf = null;
            let selectedDeviceName = '';
            let leafRowMap = new Map();

            function collectLeaves(nodes, trail) {
                let result = [];
                nodes.forEach(function (n) {
                    const t = trail.concat(n);
                    if (!n.children || !n.children.length) {
                        result.push({ node: n, path: t });
                    } else {
                        result = result.concat(collectLeaves(n.children, t));
                    }
                });
                return result;
            }
            const ALL_LEAVES = collectLeaves(TREE, []);

            function buildPathText(leaf, field) {
                const f = field || 'cn_name';
                const names = [];
                (function find(nodes, trail) {
                    for (const n of nodes) {
                        const t = trail.concat(n[f] || n.cn_name);
                        if (n === leaf) { names.push(...t); return true; }
                        if (n.children && find(n.children, t)) return true;
                    }
                    return false;
                })(TREE, []);
                return names;
            }

            function renderTreeNodes(nodes, container) {
                nodes.forEach(function (node) {
                    const li = document.createElement('li');
                    li.className = 'tree-node';
                    const hasChildren = node.children && node.children.length;

                    if (hasChildren) {
                        const row = document.createElement('div');
                        row.className = 'tree-row branch-row';
                        const twist = document.createElement('span');
                        twist.className = 'tr-twist open';
                        twist.textContent = '▶';
                        row.appendChild(twist);
                        const en = document.createElement('span');
                        en.className = 'tr-en';
                        en.textContent = node.en_name;
                        row.appendChild(en);
                        const cn = document.createElement('span');
                        cn.className = 'tr-cn';
                        cn.textContent = node.cn_name;
                        row.appendChild(cn);
                        li.appendChild(row);

                        const branch = document.createElement('div');
                        branch.className = 'tree-branch';
                        const childUl = document.createElement('ul');
                        renderTreeNodes(node.children, childUl);
                        branch.appendChild(childUl);
                        li.appendChild(branch);

                        row.addEventListener('click', function () {
                            const isCollapsed = branch.classList.toggle('collapsed');
                            twist.classList.toggle('open', !isCollapsed);
                        });
                    } else {
                        const row = document.createElement('div');
                        row.className = 'tree-row leaf-row';
                        const dot = document.createElement('span');
                        dot.className = 'tr-dot';
                        row.appendChild(dot);
                        const en = document.createElement('span');
                        en.className = 'tr-en';
                        en.textContent = node.en_name;
                        row.appendChild(en);
                        const cn = document.createElement('span');
                        cn.className = 'tr-cn';
                        cn.textContent = node.cn_name;
                        row.appendChild(cn);
                        row.addEventListener('click', function () { selectLeaf(node, row); });
                        li.appendChild(row);
                        leafRowMap.set(node, row);
                    }
                    container.appendChild(li);
                });
            }

            function renderTree() {
                cascadeTree.innerHTML = '';
                leafRowMap.clear();
                const ul = document.createElement('ul');
                renderTreeNodes(TREE, ul);
                cascadeTree.appendChild(ul);
            }

            function selectLeaf(node, row) {
                leafRowMap.forEach(function (r) { r.classList.remove('selected'); });
                row.classList.add('selected');
                selectedLeaf = node;
                document.getElementById('ccDevice').textContent = node.cn_name + ' ' + node.en_name;
                document.getElementById('ccPath').textContent = buildPathText(node).join('  ›  ');
                cascadeConfirm.classList.add('show');
                cascadeConfirm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            function clearSelection() {
                leafRowMap.forEach(function (r) { r.classList.remove('selected'); });
                selectedLeaf = null;
                cascadeConfirm.classList.remove('show');
            }

            function applyCascadeSearch(rawQuery) {
                const query = (rawQuery || '').trim();
                if (!query) {
                    searchResults.style.display = 'none';
                    cascadeEmpty.classList.remove('show');
                    cascadeSearchClear.classList.remove('show');
                    cascadeTree.style.display = '';
                    return;
                }
                cascadeSearchClear.classList.add('show');
                cascadeTree.style.display = 'none';
                searchResults.innerHTML = '';
                const q = query.toLowerCase();
                const matched = ALL_LEAVES.filter(function (item) {
                    return (item.node.cn_name || '').toLowerCase().indexOf(q) >= 0 ||
                        (item.node.en_name || '').toLowerCase().indexOf(q) >= 0;
                });
                if (!matched.length) {
                    cascadeEmpty.classList.add('show');
                    searchResults.style.display = 'none';
                    return;
                }
                cascadeEmpty.classList.remove('show');
                searchResults.style.display = 'flex';
                matched.forEach(function (item) {
                    const div = document.createElement('div');
                    div.className = 'sr-item';
                    const info = document.createElement('div');
                    info.className = 'sr-info';
                    const name = document.createElement('div');
                    name.className = 'sr-name';
                    const cn = item.node.cn_name || '';
                    const cnIdx = cn.toLowerCase().indexOf(q);
                    if (cnIdx >= 0) {
                        name.textContent = '';
                        name.appendChild(document.createTextNode(cn.slice(0, cnIdx)));
                        const h = document.createElement('span');
                        h.className = 'hl';
                        h.textContent = cn.slice(cnIdx, cnIdx + query.length);
                        name.appendChild(h);
                        name.appendChild(document.createTextNode(cn.slice(cnIdx + query.length)));
                    } else {
                        name.textContent = cn;
                    }
                    info.appendChild(name);
                    const path = document.createElement('div');
                    path.className = 'sr-path';
                    path.textContent = buildPathText(item.node).join('  ›  ');
                    info.appendChild(path);
                    div.appendChild(info);
                    const btn = document.createElement('span');
                    btn.className = 'sr-select';
                    btn.textContent = '选择';
                    div.appendChild(btn);
                    div.addEventListener('click', function () {
                        cascadeSearch.value = '';
                        cascadeSearchClear.classList.remove('show');
                        searchResults.style.display = 'none';
                        searchResults.innerHTML = '';
                        cascadeTree.style.display = '';
                        cascadeEmpty.classList.remove('show');
                        expandToNode(item.node);
                        const row = leafRowMap.get(item.node);
                        if (row) {
                            leafRowMap.forEach(function (r) { r.classList.remove('selected'); });
                            row.classList.add('selected');
                            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                        selectedLeaf = item.node;
                        document.getElementById('ccDevice').textContent = item.node.cn_name + ' ' + item.node
                            .en_name;
                        document.getElementById('ccPath').textContent = buildPathText(item.node).join(
                            '  ›  ');
                        cascadeConfirm.classList.add('show');
                    });
                    searchResults.appendChild(div);
                });
            }

            function expandToNode(targetNode) {
                const tree = cascadeTree;

                function walk(nodes) {
                    for (const node of nodes) {
                        if (node === targetNode) return true;
                        if (node.children && walk(node.children)) {
                            const rows = tree.querySelectorAll('.tree-row.branch-row');
                            rows.forEach(function (row) {
                                const twist = row.querySelector('.tr-twist');
                                const branch = row.parentElement.querySelector('.tree-branch');
                                if (twist && branch && branch.classList.contains('collapsed')) {
                                    if (branch.contains(leafRowMap.get(targetNode))) {
                                        branch.classList.remove('collapsed');
                                        twist.classList.add('open');
                                    }
                                }
                            });
                            return true;
                        }
                    }
                    return false;
                }
                walk(TREE);
            }

            document.getElementById('toFormBtn').addEventListener('click', function () {
                if (!selectedLeaf) return;
                if (EQUIPMENT_DATA[selectedLeaf.equipment_name]) {
                    deviceType.value = selectedLeaf.equipment_name;
                    selectedDeviceName = selectedLeaf.en_name || selectedLeaf.cn_name || selectedLeaf
                        .equipment_name;
                    deviceType.dispatchEvent(new Event('change'));
                }
                setStep(1);
            });

            document.getElementById('clearSelBtn').addEventListener('click', clearSelection);
            cascadeSearch.addEventListener('input', function () { applyCascadeSearch(this.value); });
            cascadeSearchClear.addEventListener('click', function () {
                cascadeSearch.value = '';
                applyCascadeSearch('');
                cascadeSearch.focus();
            });

            function initCascade() { renderTree(); }

            // ===== 初始化 =====
            step1Next.disabled = true;
            initCascade();
            updateAddLinkVisibility();
            renderBudgetPlaceholder();
            refreshDeviceDependentDropdowns();
            svcRenderOptions();      // 服务信息（D17）：三级下拉 + 紧急下拉 + 日期下限
            svcBindEvents();
            svcHintUpdate();
            if (window.DP) DP(document.getElementById('svcDate'));   // 服务时间：antd 风格 DatePicker（替换原生 date 控件）
            if (window.SEL) ['svcUrg', 'svcRegion', 'svcCountry', 'svcSite'].forEach(function (id) {
                const el = document.getElementById(id);
                if (el) SEL.mount(el, { allowClear: false });  // 服务信息下拉：antd 风格 Select（前台客户侧不显示清除按钮）
            });
            setupSearchSelect(maintType, maintTypeInput, maintTypePanel, document.getElementById('maintTypeClear'));
            setupSearchSelect(manufacturer, manufacturerInput, manufacturerPanel, document.getElementById(
                'manufacturerClear'), function () {
                    rebuildManufacturerByModel(true); // 打开/输入时先按已选型号刷新选项，再渲染面板
                });
            setupSearchSelect(model, modelInput, modelPanel, document.getElementById('modelClear'));
            setupSearchSelect(maintCycleHours, maintCycleInput, maintCyclePanel, document.getElementById('maintCycleClear'));

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    if (currentStep === 1 && !step1Next.disabled) step1Next.click();
                }
            });

            setTimeout(function () {
                // 与 PC 同源：先加载后台快照（IndexedDB），再用还原后的全局
                // PACKAGES / RULES / SITEMS 重建 H5 数据，确保套餐与可选项完全一致
                function bootH5() {
                    // 套餐与可选项仅依赖后台快照（PACKAGES / RULES.sug），与设备无关，可先构建
                    applyBackendPackages();
                    rebuildSugSet();
                    svcRenderOptions();   // 紧急/地点/系数与保底参数以后台为准（保留已选值，失效则回默认）
                    svcHintUpdate();
                    if (!deviceType.value) return;
                    EQUIPMENT_DATA = buildEquipmentData(); // 基于还原后的 SITEMS 重建
                    loadEquipmentData(deviceType.value);
                    refreshMaintTypeOptions();
                    refreshDeviceDependentDropdowns();
                    renderItems();
                    updateItemCount();
                    updateAddLinkVisibility();
                }
                if (typeof initState === 'function') {
                    initState().then(bootH5).catch(bootH5);
                } else {
                    bootH5();
                }
            }, 100);

        })();
    </script>
