<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 · 套餐配置</title>
  <link rel="stylesheet" href="assets/style.css">
</head>

<body data-page="pkg">
  <aside>
    <div class="logo"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg></span>
      <div><b>客户定价后台</b>
        
      </div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="viewTitle">套餐配置</h1>
  
      <span class="sp"></span>
    </div>
    <div class="content" id="content"></div>
  </main>

  <div class="mask" id="mask"></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="配置面板"></div>
  <div class="toast" id="toastEl" role="status" aria-live="polite"></div>
  <div class="cfmask" id="cfMask" onclick="if(event.target===this)cfClose()">
    <div class="cfbox" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle">
      <h3 id="cfTitle">确认删除</h3>
      <div class="cfmsg" id="cfMsg"></div>
      <div class="cfacts"><button class="btn" type="button" id="cfCancel">取消</button><button class="btn danger"
          type="button" id="cfOk">确认删除</button></div>
    </div>
  </div>
  <div class="cfmask" id="pkgMask" onclick="if(event.target===this)pkgModalClose()">
    <div class="cfbox" role="dialog" aria-modal="true" aria-labelledby="pkgModalTitle">
      <h3 id="pkgModalTitle">新增套餐配置<button type="button" class="cfclose" aria-label="关闭"
          onclick="pkgModalClose()">×</button></h3>
      <div class="form">
        <div class="form-item"><label><em class="form-req">*</em>套餐名称</label><input class="txt" id="npName"
            placeholder="请输入"></div>
        <div class="form-item" id="pkgMtRow"><label>维保类型</label><select class="select" id="npMt"
            onchange="npCycleSync()"></select></div>
        <div class="form-item" id="pkgCycRow"><label>保养周期</label><select class="select" id="npCycle"
            style="max-width:150px"></select></div>
        <div class="form-item" id="pkgRecRow" style="display:none"><label
            style="display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:13px;color:var(--sub)"><input
              type="checkbox" id="npRec" style="accent-color:var(--accent)"> 设为推荐</label></div>
      </div>
      <div class="cfacts"><button class="btn" type="button" onclick="pkgModalClose()">取消</button><button class="btn pri"
          type="button" id="npOk" onclick="pkgSave()">保存</button></div>
    </div>
  </div>
  <script src="assets/data.js"></script>
  <script src="assets/core.js"></script>
  <script src="js/pkg.js"></script>
  <script>boot();</script>
</body>

</html>
