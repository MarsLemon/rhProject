<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理 · 职级费率</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="rates">
<aside>
  <div class="logo"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg></span><div><b>客户定价后台</b></div></div>
  <nav id="nav"></nav>
</aside>
<main>
  <div class="topbar">
    <h1 id="viewTitle">职级费率</h1>

    <span class="sp"></span>
  </div>
  <div class="content" id="content"></div>
</main>

<div class="mask" id="mask"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="配置面板"></div>
<div class="toast" id="toastEl" role="status" aria-live="polite"></div>
<div class="cfmask" id="cfMask" onclick="if(event.target===this)cfClose()"><div class="cfbox" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle"><h3 id="cfTitle">确认删除</h3><div class="cfmsg" id="cfMsg"></div><div class="cfacts"><button class="btn" type="button" id="cfCancel">取消</button><button class="btn danger" type="button" id="cfOk">确认删除</button></div></div></div>
<div class="cfmask" id="rtMask" onclick="if(event.target===this)rtModalClose()"><div class="cfbox" role="dialog" aria-modal="true" aria-labelledby="rtTitle" style="width:420px;max-width:calc(100vw - 32px)">
  <h3><span id="rtTitle">编辑费率</span><button type="button" class="cfclose" aria-label="关闭" onclick="rtModalClose()">×</button></h3>
  <div id="rtBody">
    <div class="form">
      <div class="form-item"><label>职级</label><div class="form-static" id="rtRankLbl"></div></div>
      <div class="form-item"><label><em class="form-req">*</em>定位</label><input class="txt" id="rtRoleInp" type="text"
          maxlength="12" placeholder="请输入"></div>
      <div class="form-item"><label><em class="form-req">*</em>单价 $/h</label><input class="txt" id="rtRateInp"
          type="number" min="0" step="1" style="width:160px"></div>
    </div>
  </div>
  <div class="cfacts"><button class="btn" type="button" onclick="rtModalClose()">取消</button><button class="btn pri" type="button" id="rtOk" onclick="rtModalSave()">保存</button></div>
</div></div>
<div class="cfmask" id="arMask" onclick="if(event.target===this)arModalClose()"><div class="cfbox" role="dialog" aria-modal="true" aria-labelledby="arTitle" style="width:440px;max-width:calc(100vw - 32px)">
  <h3><span id="arTitle">新增职级</span><button type="button" class="cfclose" aria-label="关闭" onclick="arModalClose()">×</button></h3>
  <div id="arBody">
    <div class="form">
      <div class="form-item"><label><em class="form-req">*</em>职级代号</label><input class="txt" id="arKeyInp"
          type="text" maxlength="8" placeholder="请输入"></div>
      <div class="form-item"><label><em class="form-req">*</em>定位</label><input class="txt" id="arRoleInp" type="text"
          maxlength="12" placeholder="请输入"></div>
      <div class="form-item"><label><em class="form-req">*</em>单价 $/h</label><input class="txt" id="arRateInp"
          type="number" min="0" step="1" style="width:160px"></div>
    </div>
  </div>
  <div class="cfacts"><button class="btn" type="button" onclick="arModalClose()">取消</button><button class="btn pri" type="button" onclick="arModalSave()">保存</button></div>
</div></div>
<script src="assets/data.js"></script>
<script src="assets/core.js"></script>
<script src="js/rates.js"></script>
<script>boot();</script>
</body>
</html>
