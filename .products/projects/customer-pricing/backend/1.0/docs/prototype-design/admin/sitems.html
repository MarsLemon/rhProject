<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 · 服务项</title>
  <link rel="stylesheet" href="assets/style.css">
</head>

<body data-page="sitems">
  <aside>
    <div class="logo"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"
          fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" />
          <path d="M4 7.5 12 12l8-4.5M12 12v9" />
        </svg></span>
      <div><b>客户定价后台</b></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="viewTitle">服务项</h1>

      <span class="sp"></span>
    </div>
    <div class="content" id="content"></div>
  </main>

  <div class="mask" id="mask"></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="配置面板"></div>
  <div class="toast" id="toastEl" role="status" aria-live="polite"></div>
  <div class="cfmask" id="cfMask" onclick="if(event.target===this)cfClose()">
    <div class="cfbox" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle">
      <h3 id="cfTitle">确认删除</h3>
      <div class="cfmsg" id="cfMsg"></div>
      <div class="cfacts"><button class="btn" type="button" id="cfCancel">取消</button><button class="btn danger"
          type="button" id="cfOk">确认删除</button></div>
    </div>
  </div>
  <div class="cfmask" id="siMask" onclick="if(event.target===this)siModalClose()">
    <div class="cfbox" role="dialog" aria-modal="true" aria-labelledby="siModalTitle">
      <h3 id="siModalTitle">新增服务项定义<button type="button" class="cfclose" aria-label="关闭"
          onclick="siModalClose()">×</button></h3>
      <div class="form">
        <div class="form-item"><label><em class="form-req">*</em>服务项</label><input class="txt" id="nsName"
            placeholder="请输入"></div>
        <div class="form-item"><label>服务项分组</label><select class="select" id="nsGrp"></select></div>
        <div class="form-item"><label>单位</label><input class="txt" id="nsUnit" placeholder="次" value="次"
            style="width:120px"></div>
      </div>
      <div class="cfacts"><button class="btn" type="button" onclick="siModalClose()">取消</button><button class="btn pri"
          type="button" onclick="addSi()">保存</button></div>
    </div>
  </div>
  <div class="cfmask" id="siEditMask" onclick="if(event.target===this)siEditClose()">
    <div class="cfbox" role="dialog" aria-modal="true" aria-labelledby="siEditTitle">
      <h3 id="siEditTitle">编辑服务项</h3>
      <div class="form">
        <div class="form-item"><label><em class="form-req">*</em>服务项</label><input class="txt" id="esName"
            maxlength="40" placeholder="请输入" onkeydown="if(event.key==='Enter')siEditSave()"></div>
        <div class="form-item"><label>服务项分组</label><select class="select" id="esGrp"></select></div>
        <div class="form-item"><label>单位</label><input class="txt" id="esUnit" placeholder="次"
            onkeydown="if(event.key==='Enter')siEditSave()" style="width:120px"></div>
      </div>
      <span class="sub" id="esCodeTip"></span>
      <div class="cfacts"><button class="btn" type="button" onclick="siEditClose()">取消</button><button class="btn pri"
          type="button" onclick="siEditSave()">保存</button></div>
    </div>
  </div>
  <div class="cfmask" id="siStdMask" onclick="if(event.target===this)siStdClose()">
    <div class="cfbox" role="dialog" aria-modal="true" aria-labelledby="siStdTitle"
      style="width:920px;max-width:calc(100vw - 32px)">
      <h3 id="siStdTitle"><span id="siStdName">工时标准</span><button type="button" class="cfclose" aria-label="关闭"
          onclick="siStdClose()">×</button></h3>
      <div class="cfbody" id="siStdBody"></div>
      <div class="cfacts"><button class="btn" type="button" onclick="siStdClose()">关闭</button></div>
    </div>
  </div>
  <script src="assets/data.js"></script>
  <script src="assets/core.js"></script>
  <script src="js/sitems.js"></script>
  <script>boot();</script>
</body>

</html>
