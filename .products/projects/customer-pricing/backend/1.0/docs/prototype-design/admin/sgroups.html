<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 · 服务项分组</title>
  <link rel="stylesheet" href="assets/style.css">
</head>

<body data-page="sgroups">
  <aside>
    <div class="logo"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"
          fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z" />
          <path d="M4 7.5 12 12l8-4.5M12 12v9" />
        </svg></span>
      <div><b>客户定价后台</b></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="viewTitle">服务项分组</h1>

      <span class="sp"></span>
    </div>
    <div class="content" id="content"></div>
  </main>

  <div class="mask" id="mask"></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="配置面板"></div>
  <div class="toast" id="toastEl" role="status" aria-live="polite"></div>
  <div class="cfmask" id="cfMask" onclick="if(event.target===this)cfClose()">
    <div class="cfbox" role="alertdialog" aria-modal="true" aria-labelledby="cfTitle">
      <h3 id="cfTitle">确认删除</h3>
      <div class="cfmsg" id="cfMsg"></div>
      <div class="cfacts"><button class="btn" type="button" id="cfCancel">取消</button><button class="btn danger"
          type="button" id="cfOk">确认删除</button></div>
    </div>
  </div>
  <div class="cfmask" id="sgMask" onclick="if(event.target===this)sgModalClose()">
    <div class="cfbox" role="dialog" aria-modal="true" aria-labelledby="sgTitle"
      style="width:480px;max-width:calc(100vw - 32px)">
      <h3><span id="sgTitle">编辑服务项分组</span><button type="button" class="cfclose" aria-label="关闭"
          onclick="sgModalClose()">×</button></h3>
      <div id="sgBody">
        <div class="form">
          <div class="form-item"><label><em class="form-req">*</em>分组名</label><input class="txt" id="sgNameInp"
              maxlength="20" placeholder="请输入"></div>
        </div>
      </div>
      <div class="cfacts"><button class="btn" type="button" onclick="sgModalClose()">取消</button><button class="btn pri"
          type="button" id="sgOk" onclick="sgModalSave()">保存</button></div>
    </div>
  </div>
  <div class="cfmask" id="sgnMask" onclick="if(event.target===this)sgnModalClose()">
    <div class="cfbox" role="dialog" aria-modal="true" aria-labelledby="sgnTitle"
      style="width:480px;max-width:calc(100vw - 32px)">
      <h3><span id="sgnTitle">新增服务项分组</span><button type="button" class="cfclose" aria-label="关闭"
          onclick="sgnModalClose()">×</button></h3>
      <div id="sgnBody">
        <div class="form">
          <div class="form-item"><label><em class="form-req">*</em>服务项分组</label><input class="txt" id="sgnNameInp"
              maxlength="20" placeholder="请输入"></div>
        </div>
      </div>
      <div class="cfacts"><button class="btn" type="button" onclick="sgnModalClose()">取消</button><button class="btn pri"
          type="button" id="sgnOk" onclick="sgnModalSave()">保存</button></div>
    </div>
  </div>
  <script src="assets/data.js"></script>
  <script src="assets/core.js"></script>
  <script src="js/sgroups.js"></script>
  <script>boot();</script>
</body>

</html>
